# Client authentication for the opt-in `postgres-tls` service in ../docker-compose.postgres-tls.yml (DEV-12575).
# TYPE     DATABASE  USER                   ADDRESS  METHOD
# The image's healthcheck and init scripts use the Unix socket.
local      all       all                             trust
# Plaintext TCP is refused, so sslmode=disable fails and every login that works is encrypted.
hostnossl  all       all                    all      reject
# Must also present a client certificate signed by the test CA, like a Cloud SQL instance set to "Require trusted
# client certificates". The certificate's name isn't checked against the user (verify-ca), as on Cloud SQL.
hostssl    all       scratch_tls_cert_user  all      scram-sha-256 clientcert=verify-ca
hostssl    all       all                    all      scram-sha-256
