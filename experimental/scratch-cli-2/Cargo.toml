[package]
name = "scratchmd"
version = "0.1.0"
edition = "2021"
description = "Command-line tool for Scratch.md"

[[bin]]
name = "scratchmd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
# gix will be added back for Phase 10 (files download/upload with gitoxide)
# For now, git clone uses system git command
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
url = "2"
dirs = "6"
chrono = "0.4"
walkdir = "2"
similar = "2"

[dev-dependencies]
tempfile = "3"
