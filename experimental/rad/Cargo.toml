[package]
name = "rad"
version = "0.1.0"
edition = "2021"
description = "Rad — a HUD cockpit for reviewing AI-agent edits to Scratch content"

[[bin]]
name = "rad"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
maud = "0.26"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
scratch-git-2 = { path = "../../scratch-git-2" }
notify = "6"
