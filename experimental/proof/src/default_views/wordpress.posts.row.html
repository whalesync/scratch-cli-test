{# WordPress post row: 📝 tile, title, status chip, date #}
<div style="display:flex;gap:10px;align-items:center">
  <div style="width:40px;height:40px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--bg3)">📝</div>
  <div style="min-width:0;flex:1">
    <div style="display:flex;gap:8px;align-items:center">
      <span style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1">{{ title }}</span>
      <span class="chip chip-{{ 'unpublished' if data.status == 'draft' else 'added' }}" style="flex:none">{{ data.status }}</span>
      {% if changed %}<span class="r-pill r-{{ state }}" style="flex:none">{{ state }}</span>{% endif %}
    </div>
    <div style="color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ data.type }} · {{ data.date }}{% if summary %} · {{ summary }}{% endif %}</div>
  </div>
</div>
