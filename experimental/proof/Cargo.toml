[package]
name = "proof"
version = "0.1.0"
edition = "2021"
description = "Proof — a keyboard-first proofing canvas for Scratch (what content looks like before it publishes)"

[[bin]]
name = "proof"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
maud = "0.26"
minijinja = "2"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
scratch-git-2 = { path = "../../scratch-git-2" }
