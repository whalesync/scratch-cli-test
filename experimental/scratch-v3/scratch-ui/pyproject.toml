[project]
name = "scratch-ui"
version = "0.1.0"
description = "Lightweight server-rendered frontend for Scratch"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    "asyncpg>=0.31",
    "cryptography>=44",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["ruff"]
test = ["pytest", "pytest-playwright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["usability-tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
