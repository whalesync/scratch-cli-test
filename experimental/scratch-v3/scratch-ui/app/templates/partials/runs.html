<header>
  <span>Runs</span>
</header>
<section id="runs-table">
{% if jobs %}
<table>
  <thead>
    <tr>
      <th>Type</th>
      <th>Status</th>
      <th>Trigger</th>
      <th>Operations</th>
      <th>Started</th>
      <th>Finished</th>
      <th></th>
    </tr>
  </thead>
  {% for job in jobs %}
    {% include "partials/run-row.html" %}
  {% endfor %}
</table>
<script>
function toggleRunDetail(row) {
  var detail = row.nextElementSibling;
  if (detail && detail.classList.contains('run-detail')) {
    detail.hidden = !detail.hidden;
    row.classList.toggle('run-row-expanded', !detail.hidden);
  }
}
</script>
{% else %}
<empty-state>
  <p>No runs yet.</p>
  <p>Pull files or run a sync to create jobs.</p>
</empty-state>
{% endif %}
</section>
