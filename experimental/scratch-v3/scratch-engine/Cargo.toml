[workspace]
resolver = "2"
members = [
    "crates/scratch-core",
    "crates/scratch-merge",
    "crates/scratch-validate",
    "crates/scratch-transform",
    "crates/scratch-git-client",
    "crates/scratch-sync",
    "crates/scratch-publish",
    "crates/scratch-engine-py",
    "crates/scratch-cli",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
regex = "1"
unicode-normalization = "0.1"
rand = "0.8"
similar = "2"
jsonschema = "0.29"
rhai = { version = "1", features = ["sync"] }
serde_json_path = "0.7"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
pyo3 = { version = "0.23", features = ["extension-module"] }

scratch-core = { path = "crates/scratch-core" }
scratch-merge = { path = "crates/scratch-merge" }
scratch-validate = { path = "crates/scratch-validate" }
scratch-transform = { path = "crates/scratch-transform" }
scratch-git-client = { path = "crates/scratch-git-client" }
scratch-sync = { path = "crates/scratch-sync" }
scratch-publish = { path = "crates/scratch-publish" }
