# ── BUILD CLI BINARIES FOR DESKTOP BUNDLING ──
# These jobs build scratchmd for the architectures the desktop app targets,
# and expose the binaries as artifacts for the desktop release jobs to consume.
.build_cli_for_desktop:
  stage: release desktop app
  image: unawareguitar/hasty-dolphin:latest
  variables:
    GIT_DEPTH: 0
  needs: [] # allows job to run without waiting for prior stages
  cache:
    - key:
        files:
          - scratch-git-2/Cargo.lock
      fallback_keys:
        - scratch-git-2-cargo
      unprotect: true
      paths:
        - /usr/local/cargo/registry/cache
        - /usr/local/cargo/registry/index
        - scratch-git-2/target
      policy: pull
  artifacts:
    paths:
      - scratch-git-2/cli-binaries/
    expire_in: 1 day
  script:
    - cd scratch-git-2
    - mkdir -p cli-binaries/aarch64-apple-darwin cli-binaries/x86_64-unknown-linux-gnu
    - SCRATCH_DEFAULT_URL="$SCRATCH_DEFAULT_URL" cargo zigbuild --release --bin scratchmd --target aarch64-apple-darwin
    - SCRATCH_DEFAULT_URL="$SCRATCH_DEFAULT_URL" cargo zigbuild --release --bin scratchmd --target x86_64-unknown-linux-gnu
    - cp target/aarch64-apple-darwin/release/scratchmd cli-binaries/aarch64-apple-darwin/scratchmd
    - cp target/x86_64-unknown-linux-gnu/release/scratchmd cli-binaries/x86_64-unknown-linux-gnu/scratchmd

Build production CLI for desktop app:
  extends: .build_cli_for_desktop
  variables:
    SCRATCH_DEFAULT_URL: 'https://api.scratch.md'
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: true
    - if: '$CI_MERGE_REQUEST_IID'
      when: manual
      allow_failure: true

Local build production CLI for desktop app:
  extends:
    - .build_cli_for_desktop
    - .local-runner-defaults
  variables:
    SCRATCH_DEFAULT_URL: 'https://api.scratch.md'
  rules:
    - if: !reference [.rules, local_runner_users_prod]
      when: manual
      allow_failure: true
    - if: !reference [.rules, local_runner_users_mr]
      when: manual
      allow_failure: true

Build test CLI for desktop app:
  extends: .build_cli_for_desktop
  variables:
    SCRATCH_DEFAULT_URL: 'https://test-api.scratch.md'
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
    - if: '$CI_MERGE_REQUEST_IID'
      when: manual

Local build test CLI for desktop app:
  extends:
    - .build_cli_for_desktop
    - .local-runner-defaults
  variables:
    SCRATCH_DEFAULT_URL: 'https://test-api.scratch.md'
  rules:
    - if: !reference [.rules, local_runner_users_master]
      allow_failure: true
    - if: !reference [.rules, local_runner_users_mr]
      when: manual
      allow_failure: true

# PROD RELEASE JOBS (prod branch)
.release_desktop_prod_job:
  stage: release desktop app
  image: node:22
  variables:
    GIT_DEPTH: 0
    RELEASE_TYPE: 'patch'
  needs:
    - job: Build production CLI for desktop app
      artifacts: true
      optional: false
  artifacts:
    when: always
    paths:
      - scratch-desktop/dist-release/
    expire_in: 1 day
  before_script:
    - apt-get update -qq && apt-get install -y zip jq
    - cd scratch-desktop && yarn install --frozen-lockfile --ignore-engines
  script:
    - chmod +x scripts/release_public.sh
    - ./scripts/release_public.sh $RELEASE_TYPE

Release desktop Linux and Windows apps:
  extends: .release_desktop_prod_job
  inputs:
    RELEASE_TYPE:
      description: 'Release version type'
      default: 'patch'
      options:
        - 'patch'
        - 'minor'
        - 'major'
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: true
    - if: '$CI_MERGE_REQUEST_IID'
      when: manual
      allow_failure: true

# TEST RELEASE JOBS (master branch + MR pipelines, excludes scheduled pipelines)
.release_desktop_test_job:
  stage: release desktop app
  image: node:22
  variables:
    GIT_DEPTH: 0
    RELEASE_TYPE: 'patch'
  needs:
    - job: Build test CLI for desktop app
      artifacts: true
      optional: false
  artifacts:
    when: always
    paths:
      - scratch-desktop/dist-release-test/
    expire_in: 1 day
  before_script:
    - apt-get update -qq && apt-get install -y zip jq
    - cd scratch-desktop && yarn install --frozen-lockfile --ignore-engines
  script:
    - chmod +x scripts/release_test.sh
    - ./scripts/release_test.sh $RELEASE_TYPE

Release test desktop Linux and Windows apps:
  extends: .release_desktop_test_job
  inputs:
    RELEASE_TYPE:
      description: 'Release version type'
      default: 'patch'
      options:
        - 'patch'
        - 'minor'
        - 'major'
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true
    - if: '$CI_MERGE_REQUEST_IID'
      when: manual
      allow_failure: true

# -----------------------------------------------------------------------------
# Local runner: Desktop Prod Releases — macOS (builds .dmg + .zip, no Linux)
#
# These require a shell-executor runner tagged local-macos-$GITLAB_USER_LOGIN.
# See docs/local-gitlab-runner.md for setup instructions.
# -----------------------------------------------------------------------------

Local release desktop macOS app:
  extends:
    - .release_desktop_prod_job
    - .local-macos-runner-defaults
  needs:
    - job: Local build production CLI for desktop app
      artifacts: true
      optional: false
  before_script:
    - cd scratch-desktop && yarn install --frozen-lockfile --ignore-engines
  variables:
    RELEASE_TYPE: 'patch'
    MAC_TARGETS: 'dmg zip'
    BUILD_LINUX: 'false'
  inputs:
    RELEASE_TYPE:
      description: 'Release version type'
      default: 'patch'
      options:
        - 'patch'
        - 'minor'
        - 'major'
  rules:
    - if: !reference [.rules, local_runner_users_prod]
      when: manual
      allow_failure: true
    - if: !reference [.rules, local_runner_users_mr]
      when: manual
      allow_failure: true

