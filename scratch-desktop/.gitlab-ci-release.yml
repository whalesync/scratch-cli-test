# =============================================================================
# DESKTOP APP RELEASE PIPELINE
#
# Shape: bootstrap → CLI builds → package (mac, linux, windows) → upload → finalize.
#
#   1. Bootstrap decides the version once, creates a DRAFT GitHub release,
#      and emits release.env via artifacts.reports.dotenv so every downstream
#      job sees the same RELEASE_ID / NEW_VERSION / SEMVER.
#   2. CLI builds (darwin-arm64, linux-x64, windows-x64) run in parallel with
#      bootstrap — the version isn't baked into the binary, only
#      SCRATCH_DEFAULT_URL is.
#   3. Package jobs consume the matching CLI artifact + the bootstrap dotenv
#      and run electron-builder to produce signed artifacts in dist-release/.
#      The mac job runs on a shell-executor runner (required for signing) and
#      does ONLY `yarn build` + electron-builder — no curl, no jq, no GITHUB_TOKEN.
#   4. Upload jobs run on shared Linux, pull dist-release/ from their package
#      job, and POST each asset to the draft release (idempotent via DELETE-
#      then-POST).
#   5. Finalize runs on shared Linux, aggregates checksums.txt by fetching
#      assets from the release, uploads checksums.txt, flips draft: false,
#      and (for prod) updates the Homebrew cask.
#
# One GitHub release per version, with all platform artifacts attached.
# =============================================================================

include:
  - '/gitlab-ci/stages.yml'
  - '/gitlab-ci/common.yml'

# File paths that trigger the test-variant jobs to run on MRs, so the pipeline
# itself can be validated before merging changes to master. Prod-variant jobs
# never run on MRs — they stay locked to the prod branch.
.changes:
  release_pipeline:
    - scratch-desktop/.gitlab-ci-release.yml
    - scratch-desktop/scripts/bootstrap_release.sh
    - scratch-desktop/scripts/package.sh
    - scratch-desktop/scripts/upload_assets.sh
    - scratch-desktop/scripts/finalize_release.sh
    - scratch-desktop/scripts/update_homebrew_cask.sh
    - scratch-desktop/scripts/afterPack.cjs
    - scratch-desktop/electron-builder.yml

# Shared rule block for the test variant. On master pushes the test release
# runs automatically and must succeed. On MRs it's manual + allow_failure so
# the MR pipeline passes whether or not the test release is exercised.
.test_release_triggers:
  start_of_pipeline:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.changes, release_pipeline]
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
  rest_of_pipeline:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.changes, release_pipeline]
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'

# -----------------------------------------------------------------------------
# BOOTSTRAP — create draft release, emit release.env dotenv
# -----------------------------------------------------------------------------
.bootstrap_release:
  stage: release desktop app
  image: node:22
  variables:
    GIT_DEPTH: 0
    RELEASE_TYPE: 'patch'
  needs: []
  before_script:
    - apt-get update -qq && apt-get install -y jq
  script:
    - cd scratch-desktop
    - chmod +x scripts/bootstrap_release.sh
    - ./scripts/bootstrap_release.sh "$VARIANT" "$RELEASE_TYPE"
  artifacts:
    reports:
      dotenv: scratch-desktop/release.env
    expire_in: 1 day
  resource_group: github-releases

# Anyone on prod/master can cut a desktop release. The mac Package + Upload
# jobs are only created in the pipeline for users with a registered local-macos
# shell runner (gated by local_runner_users_*); for everyone else, the release
# ships without mac artifacts. Finalize uses needs.optional:true on the mac
# upload so it completes in both cases.

Bootstrap prod desktop release:
  extends: .bootstrap_release
  variables:
    VARIANT: 'prod'
  inputs:
    RELEASE_TYPE:
      description: 'Release version type'
      default: 'patch'
      options:
        - 'patch'
        - 'minor'
        - 'major'
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: false

Bootstrap test desktop release:
  extends: .bootstrap_release
  variables:
    VARIANT: 'test'
  inputs:
    RELEASE_TYPE:
      description: 'Release version type'
      default: 'patch'
      options:
        - 'patch'
        - 'minor'
        - 'major'
  rules: !reference [.test_release_triggers, start_of_pipeline]

# -----------------------------------------------------------------------------
# BUILD CLI — cross-compile scratchmd for darwin-arm64, linux-x64, windows-x64.
#
# Single job per variant (all three targets in one cargo run) to keep the cross-
# compile cache happy — parallel jobs would race on `pull-push`. The job
# `needs:` bootstrap so it fires only when a release is actually being cut.
# -----------------------------------------------------------------------------
.build_cli_for_desktop:
  stage: release desktop app
  image: unawareguitar/hasty-dolphin:latest
  variables:
    GIT_DEPTH: 0
    CARGO_HOME: '${CI_PROJECT_DIR}/.cargo'
  cache:
    - !reference [.caches, cargo_cross]
  # Restore source-file mtimes from git so cargo's fingerprint check trusts
  # the cached target/ artifacts instead of recompiling every dep.
  before_script:
    - apt-get update -qq && apt-get install -y git-restore-mtime || pip install git-restore-mtime
    - git restore-mtime
  artifacts:
    paths:
      - scratch-git-2/cli-binaries/
    expire_in: 1 day
  script:
    - cd scratch-git-2
    - mkdir -p cli-binaries/aarch64-apple-darwin cli-binaries/x86_64-unknown-linux-gnu cli-binaries/x86_64-pc-windows-gnu
    - SCRATCH_DEFAULT_URL="$SCRATCH_DEFAULT_URL" cargo zigbuild --release --bin scratchmd --target aarch64-apple-darwin
    - SCRATCH_DEFAULT_URL="$SCRATCH_DEFAULT_URL" cargo zigbuild --release --bin scratchmd --target x86_64-unknown-linux-gnu
    - SCRATCH_DEFAULT_URL="$SCRATCH_DEFAULT_URL" cargo zigbuild --release --bin scratchmd --target x86_64-pc-windows-gnu
    - cp target/aarch64-apple-darwin/release/scratchmd cli-binaries/aarch64-apple-darwin/scratchmd
    - cp target/x86_64-unknown-linux-gnu/release/scratchmd cli-binaries/x86_64-unknown-linux-gnu/scratchmd
    - cp target/x86_64-pc-windows-gnu/release/scratchmd.exe cli-binaries/x86_64-pc-windows-gnu/scratchmd.exe

Build CLI for prod desktop release:
  extends: .build_cli_for_desktop
  variables:
    SCRATCH_DEFAULT_URL: 'https://api.scratch.md'
  needs:
    - job: Bootstrap prod desktop release
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

Build CLI for test desktop release:
  extends: .build_cli_for_desktop
  variables:
    SCRATCH_DEFAULT_URL: 'https://test-api.scratch.md'
  needs:
    - job: Bootstrap test desktop release
      artifacts: false
  rules: !reference [.test_release_triggers, rest_of_pipeline]

# -----------------------------------------------------------------------------
# PACKAGE — run electron-builder. Each job produces scratch-desktop/dist-release/
# as a GitLab artifact that the downstream upload job pulls in.
#
# The mac jobs run on a shell executor (required for signing) and do ONLY
# `yarn build` + electron-builder — the GitHub upload is a separate Linux job.
# -----------------------------------------------------------------------------
.package_desktop:
  stage: release desktop app
  before_script:
    - cd scratch-desktop
    - chmod +x scripts/package.sh
  script:
    - ./scripts/package.sh "$PLATFORM"
  artifacts:
    paths:
      - scratch-desktop/dist-release/
    expire_in: 1 day

.package_desktop_linux:
  extends: .package_desktop
  image: node:22
  variables:
    PLATFORM: 'linux'
  before_script:
    - apt-get update -qq && apt-get install -y zip
    - cd scratch-desktop
    - chmod +x scripts/package.sh

# Unsigned Windows NSIS installer (Setup.exe) built on Linux. The
# electronuserland/builder:wine image ships Node + wine (with i386 multiarch)
# preinstalled, which is what electron-builder needs to run the NSIS compiler
# when cross-building Windows installers from Linux.
.package_desktop_windows:
  extends: .package_desktop
  image: electronuserland/builder:wine
  variables:
    PLATFORM: 'windows'
  before_script:
    - cd scratch-desktop
    - chmod +x scripts/package.sh

.package_desktop_mac:
  extends:
    - .package_desktop
    - .local-macos-runner-defaults
  timeout: 30 minutes
  variables:
    PLATFORM: 'mac'
    MAC_TARGETS: 'dmg zip'
  before_script:
    - source ~/.nvm/nvm.sh && nvm use
    - |
      for p in /opt/homebrew/bin /usr/local/bin "$HOME/.yarn/bin"; do
        [ -x "$p/yarn" ] && export PATH="$p:$PATH" && break
      done
    - cd scratch-desktop
    - chmod +x scripts/package.sh

Package prod macOS:
  extends: .package_desktop_mac
  variables:
    VITE_SCRATCH_API_URL: 'https://api.scratch.md'
    VITE_SCRATCH_WEB_URL: 'https://app.scratch.md'
    VITE_POSTHOG_KEY: $POSTHOG_KEY
    VITE_POSTHOG_HOST: 'https://us.i.posthog.com'
    UPDATE_CHANNEL: 'desktop'
  needs:
    - job: Bootstrap prod desktop release
      artifacts: true
    - job: Build CLI for prod desktop release
      artifacts: true
  rules:
    - if: !reference [.rules, local_runner_users_prod]

Package prod Linux:
  extends: .package_desktop_linux
  variables:
    VITE_SCRATCH_API_URL: 'https://api.scratch.md'
    VITE_SCRATCH_WEB_URL: 'https://app.scratch.md'
    VITE_POSTHOG_KEY: $POSTHOG_KEY
    VITE_POSTHOG_HOST: 'https://us.i.posthog.com'
    UPDATE_CHANNEL: 'desktop'
  needs:
    - job: Bootstrap prod desktop release
      artifacts: true
    - job: Build CLI for prod desktop release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

Package prod Windows:
  extends: .package_desktop_windows
  variables:
    VITE_SCRATCH_API_URL: 'https://api.scratch.md'
    VITE_SCRATCH_WEB_URL: 'https://app.scratch.md'
    VITE_POSTHOG_KEY: $POSTHOG_KEY
    VITE_POSTHOG_HOST: 'https://us.i.posthog.com'
    UPDATE_CHANNEL: 'desktop'
  needs:
    - job: Bootstrap prod desktop release
      artifacts: true
    - job: Build CLI for prod desktop release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

Package test macOS:
  extends: .package_desktop_mac
  variables:
    VITE_SCRATCH_API_URL: 'https://test-api.scratch.md'
    VITE_SCRATCH_WEB_URL: 'https://test.scratch.md'
    VITE_POSTHOG_KEY: $POSTHOG_KEY_DEVELOPMENT
    VITE_POSTHOG_HOST: 'https://us.i.posthog.com'
    UPDATE_CHANNEL: 'desktop-test'
  needs:
    - job: Bootstrap test desktop release
      artifacts: true
    - job: Build CLI for test desktop release
      artifacts: true
  rules:
    - if: !reference [.rules, local_runner_users_mr]
      changes: !reference [.changes, release_pipeline]
      when: manual
      allow_failure: true
    - if: !reference [.rules, local_runner_users_master]

Package test Linux:
  extends: .package_desktop_linux
  variables:
    VITE_SCRATCH_API_URL: 'https://test-api.scratch.md'
    VITE_SCRATCH_WEB_URL: 'https://test.scratch.md'
    VITE_POSTHOG_KEY: $POSTHOG_KEY_DEVELOPMENT
    VITE_POSTHOG_HOST: 'https://us.i.posthog.com'
    UPDATE_CHANNEL: 'desktop-test'
  needs:
    - job: Bootstrap test desktop release
      artifacts: true
    - job: Build CLI for test desktop release
      artifacts: true
  rules: !reference [.test_release_triggers, rest_of_pipeline]

Package test Windows:
  extends: .package_desktop_windows
  variables:
    VITE_SCRATCH_API_URL: 'https://test-api.scratch.md'
    VITE_SCRATCH_WEB_URL: 'https://test.scratch.md'
    VITE_POSTHOG_KEY: $POSTHOG_KEY_DEVELOPMENT
    VITE_POSTHOG_HOST: 'https://us.i.posthog.com'
    UPDATE_CHANNEL: 'desktop-test'
  needs:
    - job: Bootstrap test desktop release
      artifacts: true
    - job: Build CLI for test desktop release
      artifacts: true
  rules: !reference [.test_release_triggers, rest_of_pipeline]

# -----------------------------------------------------------------------------
# UPLOAD — POST dist-release/ contents to the draft GitHub release.
# Idempotent via DELETE-then-POST per asset.
# -----------------------------------------------------------------------------
.upload_assets:
  stage: release desktop app
  image: node:22
  before_script:
    - apt-get update -qq && apt-get install -y jq
    - cd scratch-desktop
    - chmod +x scripts/upload_assets.sh
  script:
    - ./scripts/upload_assets.sh

Upload prod macOS assets:
  extends: .upload_assets
  needs:
    - job: Bootstrap prod desktop release
      artifacts: true
    - job: Package prod macOS
      artifacts: true
  rules:
    - if: !reference [.rules, local_runner_users_prod]

Upload prod Linux assets:
  extends: .upload_assets
  needs:
    - job: Bootstrap prod desktop release
      artifacts: true
    - job: Package prod Linux
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

Upload prod Windows assets:
  extends: .upload_assets
  needs:
    - job: Bootstrap prod desktop release
      artifacts: true
    - job: Package prod Windows
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

Upload test macOS assets:
  extends: .upload_assets
  needs:
    - job: Bootstrap test desktop release
      artifacts: true
    - job: Package test macOS
      artifacts: true
  rules:
    - if: !reference [.rules, local_runner_users_mr]
      changes: !reference [.changes, release_pipeline]
      when: manual
      allow_failure: true
    - if: !reference [.rules, local_runner_users_master]

Upload test Linux assets:
  extends: .upload_assets
  needs:
    - job: Bootstrap test desktop release
      artifacts: true
    - job: Package test Linux
      artifacts: true
  rules: !reference [.test_release_triggers, rest_of_pipeline]

Upload test Windows assets:
  extends: .upload_assets
  needs:
    - job: Bootstrap test desktop release
      artifacts: true
    - job: Package test Windows
      artifacts: true
  rules: !reference [.test_release_triggers, rest_of_pipeline]

# -----------------------------------------------------------------------------
# FINALIZE — aggregate checksums.txt, flip draft:false, update Homebrew (prod).
# -----------------------------------------------------------------------------
.finalize_release:
  stage: release desktop app
  image: node:22
  before_script:
    - apt-get update -qq && apt-get install -y jq
    - cd scratch-desktop
    - chmod +x scripts/finalize_release.sh
  artifacts:
    when: always
    reports:
      annotations: scratch-desktop/annotations.json
    expire_in: 1 day

Finalize prod release:
  extends: .finalize_release
  needs:
    - job: Bootstrap prod desktop release
      artifacts: true
    # Mac is optional so non-local-runner users can still cut a release.
    - job: Upload prod macOS assets
      artifacts: false
      optional: true
    - job: Upload prod Linux assets
      artifacts: false
    - job: Upload prod Windows assets
      artifacts: false
  script:
    - ./scripts/finalize_release.sh
    - chmod +x scripts/update_homebrew_cask.sh
    - ./scripts/update_homebrew_cask.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

Finalize test release:
  extends: .finalize_release
  needs:
    - job: Bootstrap test desktop release
      artifacts: true
    - job: Upload test macOS assets
      artifacts: false
      optional: true
    - job: Upload test Linux assets
      artifacts: false
    - job: Upload test Windows assets
      artifacts: false
  script:
    - ./scripts/finalize_release.sh
  rules: !reference [.test_release_triggers, rest_of_pipeline]

# -----------------------------------------------------------------------------
# SLACK — notify when a desktop release build starts (after bootstrap) and when
# it is published (after finalize succeeds). NEW_VERSION comes from bootstrap’s
# dotenv report — use needs: bootstrap with artifacts: true (do not use
# dependencies: [] here; GitLab treats that as blocking all artifact/dotenv
# downloads, so variables like NEW_VERSION would be empty).
# -----------------------------------------------------------------------------
.notify_slack_desktop_release_started:
  stage: release desktop app
  allow_failure: true
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"${SLACK_DESKTOP_RELEASE_STARTED_PREFIX} Scratch Desktop ${SLACK_DESKTOP_RELEASE_LABEL} release build started — ${NEW_VERSION}\n>${CI_COMMIT_TITLE}\n<${CI_PIPELINE_URL}|View Pipeline> | <https://gitlab.com/whalesync/spinner/-/commit/${CI_COMMIT_SHA}|View Commit>\"}" \
      "${SLACK_DESKTOP_RELEASE_WEBHOOK_URL}"

Notify slack prod desktop release started:
  extends: .notify_slack_desktop_release_started
  variables:
    SLACK_DESKTOP_RELEASE_LABEL: 'production'
    SLACK_DESKTOP_RELEASE_STARTED_PREFIX: '🚀'
    SLACK_DESKTOP_RELEASE_WEBHOOK_URL: $SLACK_SCRATCH_PROD_FEED_WEBHOOK_URL
  needs:
    - job: Bootstrap prod desktop release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

.notify_slack_desktop_release_published:
  stage: release desktop app
  allow_failure: true
  script:
    - |
      RELEASE_URL="https://github.com/whalesync/scratch-desktop/releases/tag/${NEW_VERSION}"
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"${SLACK_DESKTOP_RELEASE_SLACK_PREFIX} Scratch Desktop ${SLACK_DESKTOP_RELEASE_LABEL} release published\n>${CI_COMMIT_TITLE}\n<${RELEASE_URL}|Release ${NEW_VERSION}> | <${CI_PIPELINE_URL}|View Pipeline> | <https://gitlab.com/whalesync/spinner/-/commit/${CI_COMMIT_SHA}|View Commit>\"}" \
      "${SLACK_DESKTOP_RELEASE_WEBHOOK_URL}"

Notify slack prod desktop release published:
  extends: .notify_slack_desktop_release_published
  variables:
    SLACK_DESKTOP_RELEASE_LABEL: 'production'
    SLACK_DESKTOP_RELEASE_SLACK_PREFIX: '✅'
    SLACK_DESKTOP_RELEASE_WEBHOOK_URL: $SLACK_SCRATCH_PROD_FEED_WEBHOOK_URL
  needs:
    - job: Bootstrap prod desktop release
      artifacts: true
    - job: Finalize prod release
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

Notify slack test desktop release published:
  extends: .notify_slack_desktop_release_published
  variables:
    SLACK_DESKTOP_RELEASE_LABEL: 'test'
    SLACK_DESKTOP_RELEASE_SLACK_PREFIX: '✅'
    SLACK_DESKTOP_RELEASE_WEBHOOK_URL: $SLACK_SCRATCH_TEST_FEED_WEBHOOK_URL
  needs:
    - job: Bootstrap test desktop release
      artifacts: true
    - job: Finalize test release
      artifacts: false
  rules: !reference [.test_release_triggers, rest_of_pipeline]

# -----------------------------------------------------------------------------
# CLEANUP — if the release wasn't published (still a draft), delete it so the
# tag is freed for the next attempt. Runs regardless of upstream job status so
# it also triggers when packaging/upload/finalize failed. Never fails the
# pipeline — it's a best-effort janitor.
# -----------------------------------------------------------------------------
.cleanup_failed_release:
  stage: cleanup
  script:
    - cd scratch-desktop
    - ./scripts/cleanup_failed_release.sh
  allow_failure: true

Cleanup prod desktop release:
  extends: .cleanup_failed_release
  dependencies:
    - Bootstrap prod desktop release
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: always

Cleanup test desktop release:
  extends: .cleanup_failed_release
  dependencies:
    - Bootstrap test desktop release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.changes, release_pipeline]
      when: always
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: always
