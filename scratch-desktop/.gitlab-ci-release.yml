# PROD RELEASE JOBS (prod branch)
.release_desktop_prod_job:
  stage: release desktop app
  image: node:22
  variables:
    GIT_DEPTH: 0
  needs:
    - job: build-cli-for-desktop-prod
      artifacts: true
      optional: true
    - job: build-cli-for-desktop-test
      artifacts: true
      optional: true
  artifacts:
    when: always
    paths:
      - scratch-desktop/dist-release/
    expire_in: 1 day
  before_script:
    - apt-get update -qq && apt-get install -y zip jq
    - cd scratch-desktop && yarn install --frozen-lockfile --ignore-engines
  script:
    - chmod +x scripts/release_public.sh
    - ./scripts/release_public.sh $RELEASE_TYPE
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: true

Release desktop Linux and Windows apps (patch version):
  extends: .release_desktop_prod_job
  variables:
    RELEASE_TYPE: "patch"
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true
    - if: "$CI_MERGE_REQUEST_IID"
      changes: !reference [.changes, scratch-desktop]
      when: manual
      allow_failure: true

Release desktop Linux and Windows apps (minor version):
  extends: .release_desktop_prod_job
  variables:
    RELEASE_TYPE: "minor"
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true

Release desktop Linux and Windows apps (major version):
  extends: .release_desktop_prod_job
  variables:
    RELEASE_TYPE: "major"
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true

# TEST RELEASE JOBS (master branch + MR pipelines, excludes scheduled pipelines)
.release_desktop_test_job:
  stage: release desktop app
  image: node:22
  variables:
    GIT_DEPTH: 0
  needs:
    - job: build-cli-for-desktop-prod
      artifacts: true
      optional: true
    - job: build-cli-for-desktop-test
      artifacts: true
      optional: true
  artifacts:
    when: always
    paths:
      - scratch-desktop/dist-release-test/
    expire_in: 1 day
  before_script:
    - apt-get update -qq && apt-get install -y zip jq
    - cd scratch-desktop && yarn install --frozen-lockfile --ignore-engines
  script:
    - chmod +x scripts/release_test.sh
    - ./scripts/release_test.sh $RELEASE_TYPE
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true
    - !reference [.rules, skip_for_local_runner_users]

"TEST: Release desktop Linux and Windows apps (patch version)":
  extends: .release_desktop_test_job
  variables:
    RELEASE_TYPE: "patch"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true
    - !reference [.rules, skip_for_local_runner_users]
    - if: "$CI_MERGE_REQUEST_IID"
      changes: !reference [.changes, scratch-desktop]
      when: manual
      allow_failure: true

"TEST: Release desktop Linux and Windows apps (minor version)":
  extends: .release_desktop_test_job
  variables:
    RELEASE_TYPE: "minor"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true
    - !reference [.rules, skip_for_local_runner_users]

"TEST: Release desktop Linux and Windows apps (major version)":
  extends: .release_desktop_test_job
  variables:
    RELEASE_TYPE: "major"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true
    - !reference [.rules, skip_for_local_runner_users]
