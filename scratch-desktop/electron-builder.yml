appId: md.scratch.desktop
productName: Scratch
directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!dist-release/**'
  - '!dist-release-*/**'
  - '!docs/**'
  - '!scripts/**'
  # Build inputs / local noise that must never end up in app.asar. The git
  # bundle is the dugite-native source tree afterPack.cjs copies into
  # Resources/git (~50 MB) — the asar copy would be dead weight. Logs/txt are
  # excluded both to slim the asar AND so a log written into this dir during
  # packaging can't shift asar offsets and corrupt the archive.
  - '!.git-bundle/**'
  - '!.git-bundle-cache/**'
  - '!*.log'
  - '!*.txt'
  - '!icon-1024.png'
  - '!{BUILDS.md,CLAUDE.md,UI_SYSTEM.md}'
  - '!.env'
  - '!.env.*'
  - '!*.gitlab-ci*.yml'
  # Renderer-only packages — Vite already inlines these into out/renderer, so the
  # node_modules copies inside app.asar are dead weight (~140 MB unpacked).
  # Verified by grepping src/main and src/preload: none import these at runtime.
  - '!**/node_modules/@codemirror/**'
  - '!**/node_modules/@fontsource/**'
  - '!**/node_modules/@fontsource-variable/**'
  - '!**/node_modules/@glideapps/**'
  - '!**/node_modules/@mantine/**'
  - '!**/node_modules/@uiw/**'
  - '!**/node_modules/axios/**'
  - '!**/node_modules/codemirror/**'
  - '!**/node_modules/lodash/**'
  - '!**/node_modules/lucide-react/**'
  - '!**/node_modules/marked/**'
  - '!**/node_modules/posthog-js/**'
  - '!**/node_modules/react/**'
  - '!**/node_modules/react-dom/**'
  - '!**/node_modules/react-responsive-carousel/**'
  - '!**/node_modules/react-router/**'
  - '!**/node_modules/react-router-dom/**'
  - '!**/node_modules/swr/**'
  # Build-time / renderer-transitive — never executed at runtime.
  - '!**/node_modules/@babel/**'
  - '!**/node_modules/@opentelemetry/**'
  - '!**/node_modules/browserslist/**'
  - '!**/node_modules/caniuse-lite/**'
  - '!**/node_modules/core-js/**'

asarUnpack:
  - resources/**

extraResources:
  - from: build/icons
    to: icons

# scratchmd CLI binary AND the scratchmd-native cdylib (slice H of DEV-10144)
# are copied into Resources/bin/ by scripts/afterPack.cjs from
# scratch-git-2/cli-binaries/<rust-target>/. The .node is platform-arch-
# specific and the loader at src/main/native/scratchmd-native.ts looks for
# the exact filename the napi/CI rename writes. Bundling via extraResources
# would risk shipping a stale dev-machine .node on builds where CI artifacts
# aren't yet present in scratch-git-2/napi/.

afterPack: scripts/afterPack.cjs

# Electron fuses — build-time hardening bits flipped into the Electron Framework
# binary (DEV-11000 / Oneleet SCR-005). electron-builder flips these after the
# afterPack hook and immediately BEFORE code signing, so the signature covers the
# flipped binary and no re-sign is needed.
#
# Every fuse is listed explicitly — including the ones left at Electron's default
# — so the packaged app's security posture is readable here instead of having to
# be inferred from omissions. Verify a build with:
#   npx @electron/fuses read --app dist/mac-arm64/Scratch.app
electronFuses:
  # Without this, ELECTRON_RUN_AS_NODE=1 turns the signed+notarized Scratch
  # binary into a general-purpose node interpreter, letting local malware run
  # arbitrary code under our code signature (and inherit our TCC grants /
  # entitlements). Nothing in the app or the e2e suite launches itself as node —
  # the Playwright `_electron` specs drive out/main/index.js with the unpackaged
  # dev Electron, which has its own unflipped fuse wire.
  runAsNode: false
  # NODE_OPTIONS / NODE_EXTRA_CA_CERTS are never used by the app; leaving them
  # honoured just hands an attacker another injection point.
  enableNodeOptionsEnvironmentVariable: false
  # --inspect / --inspect-brk / SIGUSR1 would expose a debugger port with full
  # main-process privileges. Devtools for packaged builds go through
  # OPEN_DEVTOOLS=1 (src/main/index.ts), which is unaffected by this fuse.
  enableNodeCliInspectArguments: false
  # Makes Electron verify app.asar against the ElectronAsarIntegrity hash that
  # electron-builder already writes into Info.plist (macOS) / the .exe resources
  # (Windows) on every build, so today's builds ship a correct-but-unenforced
  # hash. Our afterPack hook only adds Resources/bin + Resources/git and never
  # touches app.asar, so the hash stays valid; asarUnpack'd files live outside
  # the archive and are not covered either way. No-op on Linux.
  enableEmbeddedAsarIntegrityValidation: true
  # Narrows Electron's app search from `app.asar` -> `app` -> `default_app.asar`
  # down to `app.asar` alone. Without it, dropping an unsigned `app/` directory
  # next to app.asar sidesteps the integrity check entirely.
  onlyLoadAppFromAsar: true
  # Encrypts the cookie store at rest with the OS keychain/keyring. Safe to turn
  # on: auth tokens live in electron-store (src/main/auth-store.ts), not cookies,
  # so there is no session for the one-time re-encryption to invalidate.
  enableCookieEncryption: true
  # Left at Electron's default (enabled). The packaged renderer is loaded with
  # `mainWindow.loadFile(...)` — i.e. a file:// page — so revoking file://'s extra
  # privileges risks breaking asset fetches and service workers. Tightening this
  # means first serving the renderer from a custom protocol; tracked separately.
  grantFileProtocolExtraPrivileges: true
  # Left at Electron's default (disabled). Not a security fuse — it selects a
  # browser-process-specific V8 snapshot and only matters for custom snapshots.
  loadBrowserProcessSpecificV8Snapshot: false

# Notarization is handled by this hook (NOT electron-builder's built-in
# `mac.notarize`) so it can retry transient Apple-notary failures with a bounded
# per-attempt timeout and staple the result. See scripts/notarize.cjs for the
# full rationale. The hook no-ops for unsigned/ad-hoc local builds.
afterSign: scripts/notarize.cjs

mac:
  icon: build/icons/mac/icon.icns
  # Release mac builds: set CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
  # On arm64, if true, missing/wrong cert fails the build instead of "falling back to ad-hoc" (see app-builder MacPackager#sign).
  forceCodeSigning: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization + stapling are done by the afterSign hook (scripts/notarize.cjs),
  # which adds retry/backoff + a per-attempt timeout that the built-in path lacks.
  notarize: false
  # extendInfo is merged onto the Info.plist via Object.assign(plist, extendInfo) — so it must be a
  # MAP, not a YAML list (a list would assign an index-"0" key and silently drop these entries).
  extendInfo:
    NSDocumentsFolderUsageDescription: Scratch needs access to manage your workspace files.
    # App Transport Security (Oneleet SCR-009 / DEV-11004). Electron's stock Info.plist ships
    # NSAppTransportSecurity={NSAllowsArbitraryLoads:true}, disabling ATS globally; declaring the key
    # here fully replaces that inherited dict so ATS enforces HTTPS + TLS>=1.2 for every public host.
    # The ONLY ATS-governed traffic in the app is the Squirrel.Mac auto-updater's cleartext loopback
    # proxy (electron-updater's MacUpdater points native NSURLSession at http://127.0.0.1:<random>);
    # NSAllowsLocalNetworking keeps that one path working. Everything else (Scratch API, PostHog,
    # external links, scratchmd) is Chromium/Node/Rust, not NSURLSession, so ATS never touches it.
    # This value is asserted against scripts/expected-ats.cjs by src/main/__tests__/ats.spec.ts and,
    # on the packaged Info.plist, by scripts/verify-ats.cjs — change the ATS posture there, not here.
    NSAppTransportSecurity:
      NSAllowsLocalNetworking: true
  protocols:
    - name: Scratch
      schemes:
        - scratch
  artifactName: '${productName}-${version}-${arch}.${ext}'
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

win:
  icon: build/icons/win/icon.ico
  artifactName: '${productName}-${version}-${arch}.${ext}'

linux:
  icon: build/icons/png
  target:
    - AppImage
    - deb
  maintainer: Whalesync
  category: Office
  mimeTypes:
    - x-scheme-handler/scratch

publish:
  provider: github
  owner: whalesync
  repo: scratch-desktop
  channel: ${env.UPDATE_CHANNEL}
