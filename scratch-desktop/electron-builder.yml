appId: md.scratch.desktop
productName: Scratch
directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - resources/**

extraResources:
  - from: build/icons
    to: icons

mac:
  icon: build/icons/mac/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Scratch needs access to manage your workspace files.
  artifactName: '${productName}-${version}-${arch}.${ext}'
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

win:
  icon: build/icons/win/icon.ico

linux:
  icon: build/icons/png
  target:
    - AppImage
    - deb
  maintainer: Whalesync
  category: Office

publish:
  provider: github
  owner: whalesync
  repo: scratch-cli
