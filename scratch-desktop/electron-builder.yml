appId: md.scratch.desktop
productName: Scratch
directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!dist-release/**'
  - '!dist-release-*/**'
  - '!docs/**'
  - '!scripts/**'
  # Renderer-only packages — Vite already inlines these into out/renderer, so the
  # node_modules copies inside app.asar are dead weight (~140 MB unpacked).
  # Verified by grepping src/main and src/preload: none import these at runtime.
  - '!**/node_modules/@codemirror/**'
  - '!**/node_modules/@fontsource/**'
  - '!**/node_modules/@fontsource-variable/**'
  - '!**/node_modules/@glideapps/**'
  - '!**/node_modules/@mantine/**'
  - '!**/node_modules/@uiw/**'
  - '!**/node_modules/axios/**'
  - '!**/node_modules/codemirror/**'
  - '!**/node_modules/lodash/**'
  - '!**/node_modules/lucide-react/**'
  - '!**/node_modules/marked/**'
  - '!**/node_modules/posthog-js/**'
  - '!**/node_modules/react/**'
  - '!**/node_modules/react-dom/**'
  - '!**/node_modules/react-responsive-carousel/**'
  - '!**/node_modules/react-router/**'
  - '!**/node_modules/react-router-dom/**'
  - '!**/node_modules/swr/**'
  # Build-time / renderer-transitive — never executed at runtime.
  - '!**/node_modules/@babel/**'
  - '!**/node_modules/@opentelemetry/**'
  - '!**/node_modules/browserslist/**'
  - '!**/node_modules/caniuse-lite/**'
  - '!**/node_modules/core-js/**'

asarUnpack:
  - resources/**

extraResources:
  - from: build/icons
    to: icons

# scratchmd CLI binary AND the scratchmd-native cdylib (slice H of DEV-10144)
# are copied into Resources/bin/ by scripts/afterPack.cjs from
# scratch-git-2/cli-binaries/<rust-target>/. The .node is platform-arch-
# specific and the loader at src/main/native/scratchmd-native.ts looks for
# the exact filename the napi/CI rename writes. Bundling via extraResources
# would risk shipping a stale dev-machine .node on builds where CI artifacts
# aren't yet present in scratch-git-2/napi/.

afterPack: scripts/afterPack.cjs

mac:
  icon: build/icons/mac/icon.icns
  # Release mac builds: set CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
  # On arm64, if true, missing/wrong cert fails the build instead of "falling back to ad-hoc" (see app-builder MacPackager#sign).
  forceCodeSigning: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    - NSDocumentsFolderUsageDescription: Scratch needs access to manage your workspace files.
  protocols:
    - name: Scratch
      schemes:
        - scratch
  artifactName: '${productName}-${version}-${arch}.${ext}'
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

win:
  icon: build/icons/win/icon.ico
  artifactName: '${productName}-${version}-${arch}.${ext}'

linux:
  icon: build/icons/png
  target:
    - AppImage
    - deb
  maintainer: Whalesync
  category: Office
  mimeTypes:
    - x-scheme-handler/scratch

publish:
  provider: github
  owner: whalesync
  repo: scratch-desktop
  channel: ${env.UPDATE_CHANNEL}
