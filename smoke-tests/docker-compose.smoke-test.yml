# E2E smoke tests: all services needed for pull/publish testing.
# Run from repo root: docker compose -f smoke-tests/docker-compose.smoke-test.yml up --build
#
# The server, scratch-git-2, and fake-airtable are built from source.
# Tests run on the host and hit the server API over HTTP.
#
# CI mode: docker compose --profile ci ... up --build --exit-code-from test-runner
# The test-runner container runs inside the Docker network, avoiding DinD port issues.

services:
  db:
    image: postgres:16
    ports:
      - "5442:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scratchpad_smoke
    command: postgres -c timezone=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  scratch-git-2:
    build:
      context: ..
      dockerfile: smoke-tests/Dockerfile.scratch-git
    ports:
      - "3110:3100"
      - "3111:3101"
    environment:
      GIT_REPOS_DIR: /data/repos
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/3100"]
      interval: 2s
      timeout: 5s
      retries: 10

  fake-airtable:
    build:
      context: ../test-api-fakes/airtable
    ports:
      - "4656:4646"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:4646/test/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10

  fake-memberstack:
    build:
      context: ../test-api-fakes/memberstack
    ports:
      - "4662:4652"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:4652/test/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10

  fake-hubspot:
    build:
      context: ../test-api-fakes/hubspot
    ports:
      - "4663:4653"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:4653/test/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10

  fake-affinity:
    build:
      context: ../test-api-fakes/affinity
    ports:
      - "4664:4654"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:4654/test/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Fake GCS for the /upload-patch flow. fake-gcs validates that V4-signed
  # URLs carry a host matching `-public-host`, otherwise returns 404. We set
  # it to `fake-gcs:4443` (the in-docker-network hostname) so the URLs the
  # server generates pass validation. The CI test-runner is inside the docker
  # network and reaches `fake-gcs:4443` natively; local-dev host runs use a
  # custom DNS lookup in the test (resolving `fake-gcs` to `127.0.0.1`) so
  # the URL doesn't need rewriting at all — same hostname both sides.
  # fake-gcs does NOT validate the V4 signature itself, just the host header.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.49.3
    command:
      [
        "-scheme",
        "http",
        "-port",
        "4443",
        "-public-host",
        "fake-gcs:4443",
        "-backend",
        "memory",
      ]
    ports:
      - "4443:4443"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:4443/storage/v1/b || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Create the patch-upload bucket once fake-gcs is up. Runs once to completion.
  # Retries on transient errors and treats HTTP 409 (bucket exists) as success
  # so rerunning the stack is idempotent. Exits non-zero if the bucket can't be
  # confirmed after 5 attempts — without --fail-style verification, `curl -sS`
  # exits 0 on HTTP errors, which would let downstream containers start with
  # no bucket and trigger 404s on PUT (the failure mode seen on CI mr45).
  fake-gcs-bucket-init:
    image: curlimages/curl:8.7.1
    depends_on:
      fake-gcs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for attempt in 1 2 3 4 5; do
          code=$$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"name":"upload-patches-smoke"}' \
            http://fake-gcs:4443/storage/v1/b || true)
          if [ "$$code" = "200" ] || [ "$$code" = "409" ]; then
            echo "bucket ready (HTTP $$code on attempt $$attempt)"
            exit 0
          fi
          echo "attempt $$attempt: HTTP $$code, body: $$(cat /tmp/resp 2>/dev/null | head -c 200), retrying..."
          sleep 1
        done
        echo "failed to create bucket after 5 attempts"
        exit 1

  # Run migrations before starting the server
  migrate:
    build:
      context: ..
      dockerfile: server/Dockerfile.monorepo
      target: builder
    working_dir: /app/server
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/scratchpad_smoke?schema=public
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile.monorepo
    ports:
      - "3020:8080"
    environment:
      NODE_ENV: test
      APP_ENV: test
      SERVICE_TYPE: monolith
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@db:5432/scratchpad_smoke?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCRATCH_GIT_API_URL: http://scratch-git-2:3100
      SCRATCH_GIT_BACKEND_URL: http://scratch-git-2:3101
      API_URL_OVERRIDES: "https://api.airtable.com=http://fake-airtable:4646,https://admin.memberstack.com=http://fake-memberstack:4652,https://api.hubapi.com=http://fake-hubspot:4653,https://api.affinity.co=http://fake-affinity:4654"
      ENCRYPTION_MASTER_KEY: "12345678901234567890123456789012"
      USE_JOBS: "true"
      # /upload-patch GCS wiring (smoke-only fake — see fake-gcs service above).
      # GCS_API_ENDPOINT (NOT STORAGE_EMULATOR_HOST): the SDK's emulator mode
      # strips `/storage/v1` from the read baseUrl, hitting a route fake-gcs
      # doesn't serve. apiEndpoint via the constructor keeps both unsigned
      # reads (/storage/v1/b/...) and V4-signed PUTs (/<bucket>/<obj>) pointed
      # at routes fake-gcs natively serves.
      GCS_API_ENDPOINT: http://fake-gcs:4443
      GCS_PROJECT_ID: smoke-test-project
      GCS_PATCH_UPLOAD_BUCKET: upload-patches-smoke
      GOOGLE_APPLICATION_CREDENTIALS: /app/fake-gcs-sa.json
      # Clerk auth — override these via .env or environment
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_ZmFjdHVhbC1ndXBweS01NS5jbGVyay5hY2NvdW50cy5kZXYk}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY for smoke tests}
      # Disable optional services
      POSTHOG_API_KEY: ""
      POSTHOG_FEATURE_FLAG_API_KEY: ""
      SLACK_NOTIFICATION_ENABLED: "false"
      LINEAR_API_KEY: ""
      STRIPE_API_KEY: fakekey
      STRIPE_WEBHOOK_SECRET: fakesecret
      # OAuth (not needed for smoke tests)
      NOTION_CLIENT_ID: fake_id
      NOTION_CLIENT_SECRET: fake_key
      WEBFLOW_CLIENT_ID: fake_id
      WEBFLOW_CLIENT_SECRET: fake_key
      GOOGLE_CLIENT_ID: fake_id
      GOOGLE_CLIENT_SECRET: fake_key
      SHOPIFY_CLIENT_ID: fake_id
      SHOPIFY_CLIENT_SECRET: fake_key
      SUPABASE_CLIENT_ID: fake_id
      SUPABASE_CLIENT_SECRET: fake_key
      AIRTABLE_CLIENT_ID: fake_id
      AIRTABLE_CLIENT_SECRET: fake_key
      LINEAR_OAUTH_CLIENT_ID: fake_id
      LINEAR_OAUTH_CLIENT_SECRET: fake_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      scratch-git-2:
        condition: service_healthy
      fake-airtable:
        condition: service_healthy
      fake-memberstack:
        condition: service_healthy
      fake-hubspot:
        condition: service_healthy
      fake-affinity:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
      fake-gcs-bucket-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 20

  # CI-only test runner: runs inside the Docker network so it can reach services
  # by hostname. Activated with `--profile ci`. Not started by default (local dev
  # runs tests on the host via run.sh).
  test-runner:
    profiles: [ci]
    build:
      context: ..
      dockerfile: smoke-tests/Dockerfile.ci
    environment:
      SMOKE_TEST_SERVER_URL: http://server:8080
      SMOKE_TEST_SCRATCH_GIT_URL: http://scratch-git-2:3100
      FAKE_AIRTABLE_URL: http://fake-airtable:4646
      FAKE_MEMBERSTACK_URL: http://fake-memberstack:4652
      FAKE_HUBSPOT_URL: http://fake-hubspot:4653
      FAKE_AFFINITY_URL: http://fake-affinity:4654
      # CI test-runner is INSIDE the docker network, so `fake-gcs:4443` resolves
      # natively — no URL rewrite needed (run.sh sets the rewrite var for the
      # local-dev host-side runner).
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY for smoke tests}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY for smoke tests}
      INTEGRATION_TEST_USER_ID: ${INTEGRATION_TEST_USER_ID:?Set INTEGRATION_TEST_USER_ID for smoke tests}
    depends_on:
      server:
        condition: service_healthy
      fake-airtable:
        condition: service_healthy
      fake-memberstack:
        condition: service_healthy
      fake-hubspot:
        condition: service_healthy
      fake-affinity:
        condition: service_healthy
