# ── CLI RELEASE JOBS ──

# Shared zigbuild setup: cross-compile outputs live under target/<triple>/ plus
# host artifacts in target/release — use cargo_cross (see gitlab-ci/common.yml),
# not the native cargo cache.
.release_rust_cli_zigbuild:
  stage: release CLI app
  image: unawareguitar/hasty-dolphin:latest
  variables:
    GIT_DEPTH: 0
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  dependencies: []
  cache:
    - !reference [.caches, cargo_cross]
  before_script:
    - apt-get update -qq && apt-get install -y git-restore-mtime || pip install git-restore-mtime
    - git restore-mtime

# PROD RELEASE JOBS (prod branch)
.release_rust_prod_job:
  extends: .release_rust_cli_zigbuild
  script:
    - chmod +x scratch-git-2/scripts/release_public.sh
    - scratch-git-2/scripts/release_public.sh $RELEASE_TYPE
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scratch-git-2/.gitlab-ci-release.yml
      when: manual
      allow_failure: true

# Auto-deploy patch release on every merge to prod
release-rust-cli-patch:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "patch"
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: on_success

release-rust-cli-minor:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "minor"

release-rust-cli-major:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "major"

# TEST RELEASE JOBS
#
# The patch variant is cut automatically by the hourly "Hourly Test Releases"
# schedule (see release-rust-cli-test-patch). On a normal master pipeline all
# three variants appear as manual ▶︎ buttons so a dev can cut an immediate test
# release without waiting for the next hourly tick — playing one consumes a
# runner, but they never auto-run on merge. minor/major are manual only.
.release_rust_test_job:
  extends: .release_rust_cli_zigbuild
  script:
    - chmod +x scratch-git-2/scripts/release_test.sh
    - scratch-git-2/scripts/release_test.sh $RELEASE_TYPE
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true

# Auto-cut a test patch release on the hourly schedule; manual fallback on
# master. The release_test.sh no-op guard skips the build on the schedule when
# scratch-git-2/ is unchanged since the last test release (FORCE_RELEASE=1
# bypasses). No `changes:` on the schedule rule — rules:changes is always-true
# on scheduled pipelines, so the "did anything change?" check lives in the script.
release-rust-cli-test-patch:
  extends: .release_rust_test_job
  variables:
    RELEASE_TYPE: "patch"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_NAME == "Hourly Test Releases"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scratch-git-2/.gitlab-ci-release.yml
      allow_failure: true

release-rust-cli-test-minor:
  extends: .release_rust_test_job
  variables:
    RELEASE_TYPE: "minor"

release-rust-cli-test-major:
  extends: .release_rust_test_job
  variables:
    RELEASE_TYPE: "major"
