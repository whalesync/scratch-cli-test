# PROD RELEASE JOBS (prod branch)
.release_rust_prod_job:
  stage: deploy
  image: rust:latest
  variables:
    GIT_DEPTH: 0
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
    ZIG_VERSION: "0.13.0"
  dependencies: []
  cache:
    - key:
        files:
          - scratch-git-2/Cargo.lock
      fallback_keys:
        - scratch-git-2-cargo
      unprotect: true
      paths:
        - .cargo/registry/cache
        - .cargo/registry/index
        - scratch-git-2/target
      policy: pull-push
    - key: cargo-zigbuild-${ZIG_VERSION}
      unprotect: true
      paths:
        - .cargo/bin/cargo-zigbuild
        - .zig
      policy: pull-push
  before_script:
    - apt-get update -qq && apt-get install -y zip
    # Install zig from official release (skip if cached)
    - |
      if [ -d ".zig/zig-linux-x86_64-${ZIG_VERSION}" ]; then
        echo "Using cached zig ${ZIG_VERSION}"
      else
        mkdir -p .zig
        curl -sL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ -C .zig
      fi
    - export PATH="${CI_PROJECT_DIR}/.zig/zig-linux-x86_64-${ZIG_VERSION}:$PATH"
    # Install cargo-zigbuild (skip if cached)
    - |
      if [ -f "${CARGO_HOME}/bin/cargo-zigbuild" ]; then
        echo "Using cached cargo-zigbuild"
      else
        cargo install cargo-zigbuild --quiet
      fi
    - export PATH="${CARGO_HOME}/bin:$PATH"
    # If you update this list of target archs, also update the list in release_public.sh
    - rustup target add
      aarch64-apple-darwin
      x86_64-unknown-linux-gnu
      x86_64-pc-windows-gnu
  script:
    - chmod +x scratch-git-2/scripts/release_public.sh
    - scratch-git-2/scripts/release_public.sh $RELEASE_TYPE
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scratch-git-2/.gitlab-ci-release.yml
      when: manual
      allow_failure: true

# Auto-deploy patch release on every merge to prod
release-rust-cli-patch:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "patch"
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: on_success

release-rust-cli-minor:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "minor"

release-rust-cli-major:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "major"

