# PROD RELEASE JOBS (prod branch)
.release_rust_prod_job:
  stage: deploy
  image: rust:latest
  variables:
    GIT_DEPTH: 0
  dependencies: []
  before_script:
    # Install zig from official release (Debian package is too old for cargo-zigbuild)
    - export ZIG_VERSION="0.13.0"
    - curl -sL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ
    - export PATH="$PWD/zig-linux-x86_64-${ZIG_VERSION}:$PATH"
    - cargo install cargo-zigbuild --quiet
    - rustup target add
        aarch64-apple-darwin
        x86_64-apple-darwin
        x86_64-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        x86_64-pc-windows-gnu
  script:
    - chmod +x scratch-git-2/scripts/release_public.sh
    - scratch-git-2/scripts/release_public.sh $RELEASE_TYPE
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: true

# Auto-deploy patch release on every merge to prod
release-rust-cli-patch:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "patch"
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: on_success

release-rust-cli-minor:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "minor"

release-rust-cli-major:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "major"

# TEST RELEASE JOBS (master branch, excludes scheduled pipelines)
.release_rust_test_job:
  stage: deploy
  image: rust:latest
  variables:
    GIT_DEPTH: 0
  dependencies: []
  before_script:
    - export ZIG_VERSION="0.13.0"
    - curl -sL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ
    - export PATH="$PWD/zig-linux-x86_64-${ZIG_VERSION}:$PATH"
    - cargo install cargo-zigbuild --quiet
    - rustup target add
        aarch64-apple-darwin
        x86_64-apple-darwin
        x86_64-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        x86_64-pc-windows-gnu
  script:
    - chmod +x scratch-git-2/scripts/release_test.sh
    - scratch-git-2/scripts/release_test.sh $RELEASE_TYPE
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true

# Auto-deploy test patch release on every merge to master
release-rust-cli-test-patch:
  extends: .release_rust_test_job
  variables:
    RELEASE_TYPE: "patch"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: on_success

release-rust-cli-test-minor:
  extends: .release_rust_test_job
  variables:
    RELEASE_TYPE: "minor"

release-rust-cli-test-major:
  extends: .release_rust_test_job
  variables:
    RELEASE_TYPE: "major"
