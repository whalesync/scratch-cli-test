# ── BUILD CLI BINARIES FOR DESKTOP BUNDLING ──
# These jobs build scratchmd for the architectures the desktop app targets,
# and expose the binaries as artifacts for the desktop release jobs to consume.
.build_cli_for_desktop:
  stage: build and test
  image: unawareguitar/hasty-dolphin:latest
  variables:
    GIT_DEPTH: 0
  cache:
    - key:
        files:
          - scratch-git-2/Cargo.lock
      fallback_keys:
        - scratch-git-2-cargo
      unprotect: true
      paths:
        - /usr/local/cargo/registry/cache
        - /usr/local/cargo/registry/index
        - scratch-git-2/target
      policy: pull
  artifacts:
    paths:
      - scratch-git-2/cli-binaries/
    expire_in: 1 day
  script:
    - cd scratch-git-2
    - mkdir -p cli-binaries/aarch64-apple-darwin cli-binaries/x86_64-unknown-linux-gnu
    - SCRATCH_DEFAULT_URL="$SCRATCH_DEFAULT_URL" cargo zigbuild --release --bin scratchmd --target aarch64-apple-darwin
    - SCRATCH_DEFAULT_URL="$SCRATCH_DEFAULT_URL" cargo zigbuild --release --bin scratchmd --target x86_64-unknown-linux-gnu
    - cp target/aarch64-apple-darwin/release/scratchmd cli-binaries/aarch64-apple-darwin/scratchmd
    - cp target/x86_64-unknown-linux-gnu/release/scratchmd cli-binaries/x86_64-unknown-linux-gnu/scratchmd

build-cli-for-desktop-prod:
  extends: .build_cli_for_desktop
  variables:
    SCRATCH_DEFAULT_URL: "https://api.scratch.md"
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: on_success

build-cli-for-desktop-test:
  extends: .build_cli_for_desktop
  variables:
    SCRATCH_DEFAULT_URL: "https://test-api.scratch.md"
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: on_success
    - if: "$CI_MERGE_REQUEST_IID"
      changes:
        - scratch-git-2/**/*
        - scratch-desktop/**/*
      when: on_success

# ── CLI RELEASE JOBS ──

# PROD RELEASE JOBS (prod branch)
.release_rust_prod_job:
  stage: deploy
  image: unawareguitar/hasty-dolphin:latest
  variables:
    GIT_DEPTH: 0
  dependencies: []
  cache:
    - key:
        files:
          - scratch-git-2/Cargo.lock
      fallback_keys:
        - scratch-git-2-cargo
      unprotect: true
      paths:
        - /usr/local/cargo/registry/cache
        - /usr/local/cargo/registry/index
        - scratch-git-2/target
      policy: pull-push
  script:
    - chmod +x scratch-git-2/scripts/release_public.sh
    - scratch-git-2/scripts/release_public.sh $RELEASE_TYPE
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scratch-git-2/.gitlab-ci-release.yml
      when: manual
      allow_failure: true

# Auto-deploy patch release on every merge to prod
release-rust-cli-patch:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "patch"
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: on_success

release-rust-cli-minor:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "minor"

release-rust-cli-major:
  extends: .release_rust_prod_job
  variables:
    RELEASE_TYPE: "major"

# TEST RELEASE JOBS (master branch, excludes scheduled pipelines)
.release_rust_test_job:
  stage: deploy
  image: unawareguitar/hasty-dolphin:latest
  variables:
    GIT_DEPTH: 0
  dependencies: []
  cache:
    - key:
        files:
          - scratch-git-2/Cargo.lock
      fallback_keys:
        - scratch-git-2-cargo
      unprotect: true
      paths:
        - /usr/local/cargo/registry/cache
        - /usr/local/cargo/registry/index
        - scratch-git-2/target
      policy: pull-push
  script:
    - chmod +x scratch-git-2/scripts/release_test.sh
    - scratch-git-2/scripts/release_test.sh $RELEASE_TYPE
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true

# Auto-deploy test patch release on every merge to master
release-rust-cli-test-patch:
  extends: .release_rust_test_job
  variables:
    RELEASE_TYPE: "patch"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scratch-git-2/.gitlab-ci-release.yml
      allow_failure: true

release-rust-cli-test-minor:
  extends: .release_rust_test_job
  variables:
    RELEASE_TYPE: "minor"

release-rust-cli-test-major:
  extends: .release_rust_test_job
  variables:
    RELEASE_TYPE: "major"
