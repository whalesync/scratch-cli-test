[package]
name = "scratch-git-2"
version = "0.1.0"
edition = "2021"
default-run = "scratch-git-2"

[[bin]]
name = "scratch-git-2"
path = "src/service/main.rs"

[[bin]]
name = "scratchmd"
path = "src/cli/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
gix = { version = "0.70", features = ["merge", "blob-diff", "blocking-http-transport-reqwest-rust-tls"] }
zip = { version = "2", features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dashmap = "6"
imara-diff = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde_yaml = "0.9"
open = "5"
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
urlencoding = "2"
rayon = "1.11.0"
rhai = { version = "1", features = ["sync"] }
rustpython-vm = { version = "0.5.0", default-features = false, features = ["compiler"] }
flate2 = "1.1.9"
jsonschema = { version = "0.46", default-features = false }
sha2 = "0.10"

[patch.crates-io]
# Fix for x86_64-pc-windows-gnu (MinGW): get_tz_info was gated on cfg(target_env="msvc")
# but is referenced unconditionally on cfg(windows) targets. Upstream bug in rustpython-vm 0.5.0.
# https://github.com/whalesync/rustpython-vm-patched/tree/fix/windows-gnu-get-tz-info
rustpython-vm = { git = "https://github.com/whalesync/rustpython-vm-patched", rev = "613427c807c193566b46759445c991809ebbb682" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }

# Limit debug info in dev/test builds to reduce linker memory usage.
# Without this, cold CI builds (no cargo cache) OOM during linking.
[profile.dev]
debug = "line-tables-only"
