include:
  - "/gitlab-ci/stages.yml"
  - "/gitlab-ci/common.yml"

#region test env

deploy api service to Cloud Run test environment:
  stage: deploy
  extends:
    - .gcp_eu_test_env # sets before_script and variables
  script:
    - IMAGE_URL=${GCP_REGISTRY_URL}/spinner-server:$CI_COMMIT_SHORT_SHA
    - gcloud run services update api-service --image="${IMAGE_URL}"
    - gcloud run services update-traffic api-service --to-latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/05-deploy.yml
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

deploy client service to Cloud Run test environment:
  stage: deploy
  extends:
    - .gcp_eu_test_env # sets before_script and variables
  script:
    - IMAGE_URL=${GCP_REGISTRY_URL}/spinner-client:$CI_COMMIT_SHORT_SHA
    - gcloud run services update client-service --image="${IMAGE_URL}"
    - gcloud run services update-traffic client-service --to-latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/05-deploy.yml
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

deploy cron service to Cloud Run test environment:
  stage: deploy
  extends:
    - .gcp_eu_test_env # sets before_script and variables
  script:
    - IMAGE_URL=${GCP_REGISTRY_URL}/spinner-server:$CI_COMMIT_SHORT_SHA
    - gcloud run services update cron-service --image="${IMAGE_URL}"
    - gcloud run services update-traffic cron-service --to-latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/05-deploy.yml
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

deploy worker service to Cloud Run test environment:
  stage: deploy
  extends:
    - .gcp_eu_test_env # sets before_script and variables
  script:
    - IMAGE_URL=${GCP_REGISTRY_URL}/spinner-server:$CI_COMMIT_SHORT_SHA
    - gcloud run services update worker-service --image="${IMAGE_URL}"
    - gcloud run services update-traffic worker-service --to-latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/05-deploy.yml
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

deploy scratch-git to test environment:
  stage: deploy
  extends:
    - .gcp_eu_test_env
  script:
    - IMAGE_URL=${GCP_REGISTRY_URL}/spinner-scratch-git:${CI_COMMIT_SHORT_SHA}
    - |
      gcloud compute ssh scratch-git \
        --project spv1eu-test \
        --zone europe-west1-b \
        --tunnel-through-iap \
        -- "sudo bash /mnt/disks/data/.deploy/deploy.sh $IMAGE_URL"
    # Verify the deployed version is running through the nginx proxy
    - |
      HEALTH=$(gcloud compute ssh scratch-git \
        --project spv1eu-test \
        --zone europe-west1-b \
        --tunnel-through-iap \
        -- "curl -sf http://localhost:3100/health")
      echo "$HEALTH"
      if [ -z "$HEALTH" ]; then echo "ERROR: scratch-git health check failed"; exit 1; fi
      echo "$HEALTH" | grep -q "$CI_COMMIT_SHORT_SHA" || (echo "ERROR: Expected build containing $CI_COMMIT_SHORT_SHA but got: $HEALTH" && exit 1)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/05-deploy.yml
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

notify slack on failure test environment:
  stage: deployment notifications
  dependencies: []
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"❌ Failed to deploy Scratch to GCP - Test (EU)\n<${CI_PIPELINE_URL}|View Pipeline>\"}" \
      ${SLACK_SCRATCH_TEST_FEED_WEBHOOK_URL}
  rules:
    - !reference [.rules, on_merge_to_master]
  when: on_failure
  allow_failure: true

notify slack on success test environment:
  stage: deployment notifications
  dependencies: []
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"✅ Successfully deployed Scratch to GCP - Test (EU)\"}" \
      ${SLACK_SCRATCH_TEST_FEED_WEBHOOK_URL}
  rules:
    - !reference [.rules, on_merge_to_master]
  when: on_success
  allow_failure: true

#endregion

