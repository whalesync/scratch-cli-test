include:
  - "/gitlab-ci/stages.yml"
  - "/gitlab-ci/common.yml"

#region test env

deploy api service to Cloud Run test environment:
  stage: deploy
  resource_group: environment:test:service:api-service
  extends:
    - .gcp_eu_test_env # sets before_script and variables
  script:
    - IMAGE_URL=${GCP_REGISTRY_URL}/spinner-server:$CI_COMMIT_SHORT_SHA
    - gcloud run services update api-service --image="${IMAGE_URL}"
    - gcloud run services update-traffic api-service --to-latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/05-deploy.yml
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

deploy client service to Cloud Run test environment:
  stage: deploy
  resource_group: environment:test:service:client-service
  extends:
    - .gcp_eu_test_env # sets before_script and variables
  script:
    - IMAGE_URL=${GCP_REGISTRY_URL}/spinner-client:$CI_COMMIT_SHORT_SHA
    - gcloud run services update client-service --image="${IMAGE_URL}"
    - gcloud run services update-traffic client-service --to-latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/05-deploy.yml
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

deploy cron service to Cloud Run test environment:
  stage: deploy
  resource_group: environment:test:service:cron-service
  extends:
    - .gcp_eu_test_env # sets before_script and variables
  script:
    - IMAGE_URL=${GCP_REGISTRY_URL}/spinner-server:$CI_COMMIT_SHORT_SHA
    - gcloud run services update cron-service --image="${IMAGE_URL}"
    - gcloud run services update-traffic cron-service --to-latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/05-deploy.yml
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

deploy worker service to Cloud Run test environment:
  stage: deploy
  resource_group: environment:test:service:worker-service
  extends:
    - .gcp_eu_test_env # sets before_script and variables
  script:
    - IMAGE_URL=${GCP_REGISTRY_URL}/spinner-server:$CI_COMMIT_SHORT_SHA
    - gcloud run services update worker-service --image="${IMAGE_URL}"
    - gcloud run services update-traffic worker-service --to-latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/05-deploy.yml
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

deploy scratch-git to test environment:
  stage: deploy
  resource_group: environment:test:service:scratch-git
  extends:
    - .gcp_eu_test_env
  script:
    # Deploy + health verification both live in the shared script: every
    # `gcloud compute ssh` into the VM is retried with backoff, because OS Login
    # can transiently reject one with "Permission denied (publickey)".
    - |
      bash "${CI_PROJECT_DIR}/scripts/ci/deploy-scratch-git.sh" \
        spv1eu-test \
        europe-west1-b \
        "${GCP_REGISTRY_URL}/spinner-scratch-git:${CI_COMMIT_SHORT_SHA}" \
        "${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/05-deploy.yml
        # The deploy logic itself lives in the script, so a script-only edit
        # must also offer this manual job — otherwise it reaches master (and
        # then production) without ever having been run once in an MR.
        - scripts/ci/deploy-scratch-git.sh
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

notify slack on failure test environment:
  stage: deployment notifications
  dependencies: []
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"❌ Failed to deploy Scratch to GCP - Test (EU)\n>${CI_COMMIT_TITLE}\n<${CI_PIPELINE_URL}|View Pipeline> | <https://gitlab.com/whalesync/spinner/-/commit/${CI_COMMIT_SHA}|View Commit> | <https://test-api.scratch.md/health|API Health>\"}" \
      ${SLACK_SCRATCH_TEST_FEED_WEBHOOK_URL}
  rules:
    - !reference [.rules, on_merge_to_master]
  when: on_failure
  allow_failure: true

notify slack on success test environment:
  stage: deployment notifications
  dependencies: []
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"✅ Successfully deployed Scratch to GCP - Test (EU)\n>${CI_COMMIT_TITLE}\n<https://gitlab.com/whalesync/spinner/-/commit/${CI_COMMIT_SHA}|View Commit> | <https://test-api.scratch.md/health|API Health>\"}" \
      ${SLACK_SCRATCH_TEST_FEED_WEBHOOK_URL}
  rules:
    - !reference [.rules, on_merge_to_master]
  when: on_success
  allow_failure: true

#endregion

