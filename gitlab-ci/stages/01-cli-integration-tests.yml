include:
  - "/gitlab-ci/stages.yml"
  - "/gitlab-ci/common.yml"

# =============================================================================
# CLI INTEGRATION TESTS
#
# Jest suites in scratch-cli-tests/ shell out to the Rust scratchmd binary
# against a remote Scratch stack. The job builds scratchmd here (rust:slim-
# bookworm) and passes SCRATCH_CLI_BINARY so global-setup does not run cargo.
# Uses .caches.cargo_cli_integration only (separate registry + target tree from
# other Rust jobs). CARGO_HOME / CARGO_TARGET_DIR / SCRATCH_CLI_BINARY must stay
# aligned with gitlab-ci/common.yml. Integration env comes from the GitLab File
# variable CLI_INTEGRATION_TEST_CONFIG (copied to scratch-cli-tests/.env.integration).
# Triggered only by the scheduled pipeline named "Scheduled CLI Tests"
# (PIPELINE_NAME).
# =============================================================================

.changes:
  cli-integration-tests:
    - gitlab-ci/stages/01-cli-integration-tests.yml
    - scratch-cli-tests/**/*

.cli-integration-tests:
  stage: build and test
  image: rust:slim-bookworm
  interruptible: true
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-cli-integration"
    CARGO_TARGET_DIR: "${CI_PROJECT_DIR}/scratch-git-2/target-cli-integration"
    # Prebuilt in script/; global-setup skips cargo when this is set.
    SCRATCH_CLI_BINARY: "${CI_PROJECT_DIR}/scratch-git-2/target-cli-integration/release/scratchmd"
  cache:
    - !reference [.caches, cargo_cli_integration]
  timeout: 45m
  before_script:
    - apt-get update && apt-get install -y pkg-config libssl-dev git git-restore-mtime ca-certificates curl gnupg && rm -rf /var/lib/apt/lists/*
    - git -C "${CI_PROJECT_DIR}" restore-mtime
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get update && apt-get install -y nodejs && rm -rf /var/lib/apt/lists/*
    - corepack enable && corepack prepare yarn@1.22.22 --activate
    - |
      if [ -z "${CLI_INTEGRATION_TEST_CONFIG:-}" ] || [ ! -f "${CLI_INTEGRATION_TEST_CONFIG}" ]; then
        echo "ERROR: Set CI/CD variable CLI_INTEGRATION_TEST_CONFIG (File type) with scratch-cli-tests env contents."
        exit 1
      fi
    - cp "${CLI_INTEGRATION_TEST_CONFIG}" scratch-cli-tests/.env.integration
  script:
    # Retry wrapper, same as .use_nvm in common.yml — this job has its own copy
    # of the install because it runs on rust:slim-bookworm (no nvm).
    - bash "${CI_PROJECT_DIR}/scripts/ci/yarn-install-with-retry.sh" --cache-folder .yarn --prefer-offline
    # Subshell so cwd stays at repo root (GitLab runs the whole script in one shell).
    - (cd scratch-git-2 && cargo build --bin scratchmd --release)
    - cd scratch-cli-tests && yarn test:integration

cli integration tests:
  extends: .cli-integration-tests
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_NAME == "Scheduled CLI Tests"'

notify slack on cli integration test failure:
  stage: build and test
  dependencies: []
  needs:
    - job: cli integration tests
      optional: true
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"❌ CLI integration tests failed\n<${CI_PIPELINE_URL}|View Pipeline>\"}" \
      ${SLACK_SCRATCH_TEST_FEED_WEBHOOK_URL}
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_NAME == "Scheduled CLI Tests"'
      when: on_failure
  allow_failure: true
