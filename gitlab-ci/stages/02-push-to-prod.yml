include:
  - "/gitlab-ci/stages.yml"
  - "/gitlab-ci/common.yml"

push master to prod:
  stage: push to prod
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git config user.email "team+ci-bot@whalesync.com"
    - git config user.name "ci-bot"
    - git remote set-url origin https://oauth2:$CICD_ACCESS_TOKEN@gitlab.com/whalesync/spinner.git
    - git fetch --all --prune
    - git checkout -B master origin/master
    - git checkout -B prod origin/prod
    # Put the summaries of the commits being merged into the merge commit body, so the
    # git history and the "release build started" Slack ping (gitlab-ci/stages/01-build-and-test.yml)
    # both show what's actually in the release.
    - COMMIT_LIST=$(git log --no-merges --format='- %s' HEAD..master)
    - git merge -m "(Auto) Merge branch 'master' into prod" -m "${COMMIT_LIST:-(no new commits)}" --no-ff -X theirs master
    - git push origin prod
    - echo "Successfully merged master into prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_NAME == "AUTO_PUSH_PROD"'
