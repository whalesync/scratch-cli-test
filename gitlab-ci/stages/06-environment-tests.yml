include:
  - "/gitlab-ci/stages.yml"
  - "/gitlab-ci/common.yml"

# =============================================================================
# ENVIRONMENT TESTS
# =============================================================================

environment tests for test env post-deploy:
  stage: post-deploy environment tests
  interruptible: false
  resource_group: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: scratchpaper
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/scratchpaper"
    CLERK_SECRET_KEY: "${CLERK_SECRET_KEY_DEVELOPMENT}"
    INTEGRATION_TEST_CLIENT_DOMAIN: "test.scratch.md"
    INTEGRATION_TEST_API_DOMAIN: "test-api.scratch.md"
    INTEGRATION_TEST_USER_ID: user_35RRk1ww8PJ4g0TfVfxbeU5iFJz
    # Live connector integration tests. Each *-connector.spec.ts self-skips (describe.skip) when its
    # key is unset, so any CI/CD variable left empty simply skips that connector's suite — wiring them
    # all is safe. Define these as masked CI/CD variables in the GitLab project settings to enable the
    # corresponding connector. (Most connectors ALSO have a fake-backed spec that runs with no key —
    # e.g. hubspot-connector.spec.ts; the *-live.spec.ts variants below need a real credential.)
    NOTION_API_KEY: "${INTEGRATION_TEST_NOTION_API_KEY}"
    # HubSpot — dedicated test portal. HUBSPOT_API_KEY is a Private App access token (`pat-na1-…`) with
    # crm.objects.contacts + crm.objects.companies read & write scopes; enables hubspot-connector-live.spec.ts
    # (associations round-trip, DEV-10847). Provision the portal + token and set INTEGRATION_TEST_HUBSPOT_API_KEY.
    HUBSPOT_API_KEY: "${INTEGRATION_TEST_HUBSPOT_API_KEY}"
    # Attio — dedicated free IT workspace (login testing+integration@whalesync.com), bootstrapped via
    # scripts/bootstrap-attio-test-data.ts. Set INTEGRATION_TEST_ATTIO_API_KEY as a masked CI/CD variable.
    ATTIO_API_KEY: "${INTEGRATION_TEST_ATTIO_API_KEY}"
    # GoHighLevel — WhaleSync test Location. Both values are masked CI/CD variables; the same pair
    # lives in server/.env.integration so the suite can be reproduced locally.
    GOHIGHLEVEL_API_TOKEN: "${INTEGRATION_TEST_GOHIGHLEVEL_API_TOKEN}"
    GOHIGHLEVEL_LOCATION_ID: "${INTEGRATION_TEST_GOHIGHLEVEL_LOCATION_ID}"
    # Airtable — dedicated test account. AIRTABLE_API_KEY runs the record-CRUD spec; AIRTABLE_TEST_BASE_ID
    # also enables the create-schema suite. ⚠️ TEMPORARY: create-schema CANNOT delete tables (no
    # delete-table API) so it adds a `scratch_it_<ts>` table per run to the throwaway base (cap: 1000
    # tables/base). Here only to confirm it works — move to a deeper/scheduled pass + trash the base periodically.
    AIRTABLE_API_KEY: "${INTEGRATION_TEST_AIRTABLE_API_KEY}"
    AIRTABLE_TEST_BASE_ID: "${INTEGRATION_TEST_AIRTABLE_TEST_BASE_ID}"
    # Affinity — runs against the company's PRODUCTION Affinity org. The read suites anchor to a
    # preserved fixture list ("[Do Not Touch] … (Scratch Int Test)"). ⚠️ The write round-trip
    # creates+deletes a throwaway "ZZZ-Integration" person on prod each run (self-cleans). Consider
    # gating writes / a scheduled cadence later.
    AFFINITY_API_KEY: "${INTEGRATION_TEST_AFFINITY_API_KEY}"
    # Webflow — dedicated test site "Scratch Integration Tests" (site-scoped token, login
    # testing@whalesync.com). Seeding: the site has a CMS collection AND is published once
    # (CMS live ops 409 on a never-published site). ⚠️ token expires after 365 days of inactivity.
    WEBFLOW_API_KEY: "${INTEGRATION_TEST_WEBFLOW_API_KEY}"

    # Whalesync shadow-user / session admin-channel test (whalesync-shadow-user.spec.ts). Drives the
    RUN_WHALESYNC_INTEGRATION: "true"
    WHALESYNC_TEST_API_ONLY: "true"
    SCRATCH_ADMIN_API_KEY: "${INTEGRATION_TEST_SCRATCH_ADMIN_API_KEY}"

  script:
    - !reference [.build_shared_types, script]
    - cd server
    - !reference [.use_nvm, script]
    - yarn run migrate
    - yarn run test:integration --verbose --reporters=default --reporters=jest-junit
  cache: !reference [.caches, server]
  dependencies: []
  artifacts:
    when: always
    reports:
      junit: "server/junit.xml"
    expire_in: 1 week
  rules:
    - !reference [.rules, on_merge_to_master]

environment tests for test env pre-deploy:
  stage: pre-deploy environment tests
  interruptible: false
  resource_group: test
  variables:
    CLERK_SECRET_KEY: "${CLERK_SECRET_KEY_DEVELOPMENT}"
    INTEGRATION_TEST_CLIENT_DOMAIN: "test.scratch.md"
    INTEGRATION_TEST_API_DOMAIN: "test-api.scratch.md"
    INTEGRATION_TEST_USER_ID: user_35RRk1ww8PJ4g0TfVfxbeU5iFJz
  script:
    - cd server
    - !reference [.use_nvm, script]
    - yarn run test:integration --verbose --reporters=default --reporters=jest-junit
  cache: !reference [.caches, server]
  artifacts:
    when: always
    reports:
      junit: "server/junit.xml"
    expire_in: 1 week
  rules:
    # - !reference [.rules, on_merge_to_prod]
    - when: never
notify slack on environment test failure test env post-deploy:
  stage: post-deploy environment tests
  needs:
    - environment tests for test env post-deploy
  dependencies: []
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"❌ Integration tests for Scratch failed - Test\n<${CI_PIPELINE_URL}|View Pipeline>\"}" \
      ${SLACK_SCRATCH_TEST_FEED_WEBHOOK_URL}
  rules:
    - !reference [.rules, on_merge_to_master]
  when: on_failure
