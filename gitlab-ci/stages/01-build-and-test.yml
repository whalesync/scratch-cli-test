include:
  - "/gitlab-ci/stages.yml"
  - "/gitlab-ci/common.yml"

# =============================================================================
# SHARED-TYPES SUBPROJECT
# =============================================================================
#
# @spinner/shared-types is consumed by the server and all three frontends, but
# the client/server/scratch-desktop jobs each `cd` into their own subproject and
# only lint THAT package — so a style/lint regression in packages/shared-types
# would otherwise ship unchecked (it's only ever `yarn build`-ed elsewhere). This
# job closes that gap with the package's own prettier + eslint + tsc gate.

.build-and-test-shared-types:
  stage: build and test
  interruptible: true
  tags: !reference [.runner_tags, high_memory]
  script:
    - cd packages/shared-types
    - !reference [.use_nvm, script]
    - yarn prettier:check
    - yarn lint-strict
    - yarn typecheck
    - yarn build

build and test shared-types:
  extends: .build-and-test-shared-types
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, shared-types]
    - !reference [.rules, on_merge_to_master]

# =============================================================================
# CLIENT SUBPROJECT
# =============================================================================

.build-and-test-client:
  stage: build and test
  interruptible: true
  tags: !reference [.runner_tags, high_memory]
  script:
    - !reference [.build_shared_types, script]
    - cd client
    - !reference [.use_nvm, script]
    - yarn prettier:check
    - yarn lint-strict
    - yarn typecheck
    - yarn test
    - export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY_DEVELOPMENT
    - yarn build
  artifacts:
    paths:
      - client/.next
    expire_in: 1 hour

build and test client:
  extends: .build-and-test-client
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, client]
    - !reference [.rules, on_merge_to_master]

.build-client-docker-image-for-test:
  stage: build and test
  tags: !reference [.runner_tags, high_memory]
  variables:
    # Everything we deploy runs linux/amd64 — Cloud Run (client, server) and the
    # scratch-git GCE VM. `docker build` with no --platform targets the *host*
    # arch, so without this a builder on an Apple Silicon Mac quietly produces
    # an arm64 image that Cloud Run refuses with "Container manifest type must
    # support amd64/linux".
    #
    # The local-runner variants of these jobs override this to "" in
    # .local-docker-build (gitlab-ci/local-runners.yml): their image tars are
    # never pushed, so they build native-arch for speed.
    DOCKER_BUILD_PLATFORM_ARGS: "--platform linux/amd64"
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - client/image-test.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    # Bake the @spinner/shared-types version into _build.ts so the bundled
    # workspace copy reports it via getBuild() in the deployed client. The
    # Dockerfile's deps stage compiles src/_build.ts into the package, so this
    # must run on the build context BEFORE `docker build`.
    - 'sed -i "s/BUILD = ''local''/BUILD = ''0.0.0-master-${CI_COMMIT_SHORT_SHA}''/" packages/shared-types/src/_build.ts'
    # Environment-specific .env flags are set here.
    # Service-type flags are set in terraform on launch.
    - >
      docker build
      ${DOCKER_BUILD_PLATFORM_ARGS}
      --build-arg APP_ENV=test
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      --build-arg CLERK_PUBLISHABLE_KEY="${CLERK_PUBLISHABLE_KEY_DEVELOPMENT}"
      --build-arg NEXT_PUBLIC_POSTHOG_KEY="${POSTHOG_KEY_DEVELOPMENT}"
      --build-arg NEXT_PUBLIC_POSTHOG_HOST="https://us.i.posthog.com"
      --build-arg NEXT_PUBLIC_API_URL=https://test-api.scratch.md
      --build-arg POSTHOG_PROJECT_ID="${POSTHOG_PROJECT_ID_TEST}"
      --build-arg POSTHOG_CLI_API_KEY="${POSTHOG_CLI_API_KEY_TEST}"
      -t spinner/spinner-client-test
      -f client/Dockerfile.monorepo .
    - docker save spinner/spinner-client-test > client/image-test.tar

build client docker image for test:
  extends: .build-client-docker-image-for-test
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, client-docker]
    - !reference [.rules, on_merge_to_master]

build client docker image for production:
  stage: build and test
  tags: !reference [.runner_tags, high_memory]
  variables:
    # See the note on .build-client-docker-image-for-test.
    DOCKER_BUILD_PLATFORM_ARGS: "--platform linux/amd64"
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - client/image-production.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    # Bake the @spinner/shared-types version into _build.ts so the bundled
    # workspace copy reports it via getBuild() in the deployed client. The
    # Dockerfile's deps stage compiles src/_build.ts into the package, so this
    # must run on the build context BEFORE `docker build`.
    - 'sed -i "s/BUILD = ''local''/BUILD = ''0.0.0-prod-${CI_COMMIT_SHORT_SHA}''/" packages/shared-types/src/_build.ts'
    # Environment-specific .env flags are set here.
    # Service-type flags are set in terraform on launch.
    - >
      docker build
      ${DOCKER_BUILD_PLATFORM_ARGS}
      --build-arg APP_ENV=production
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      --build-arg CLERK_PUBLISHABLE_KEY="${CLERK_PUBLISHABLE_KEY_PRODUCTION}"
      --build-arg NEXT_PUBLIC_POSTHOG_KEY="${POSTHOG_KEY}"
      --build-arg NEXT_PUBLIC_POSTHOG_HOST="https://us.i.posthog.com"
      --build-arg NEXT_PUBLIC_API_URL=https://api.scratch.md
      --build-arg NEXT_PUBLIC_GA_ID=G-GVXSMCZ3JR
      --build-arg POSTHOG_PROJECT_ID="${POSTHOG_PROJECT_ID_PRODUCTION}"
      --build-arg POSTHOG_CLI_API_KEY="${POSTHOG_CLI_API_KEY_PRODUCTION}"
      -t spinner/spinner-client-production
      -f client/Dockerfile.monorepo .
    - docker save spinner/spinner-client-production > client/image-production.tar
  rules:
    - !reference [.rules, on_merge_to_prod]

# =============================================================================
# SERVER SUBPROJECT
# =============================================================================

.build-and-test-server:
  stage: build and test
  interruptible: true
  tags: !reference [.runner_tags, high_memory]
  variables:
    # Jest defaults to one worker per CPU, and every CI container sees all of
    # its machine's CPUs: 10 to 12 on the Mac fleet, 14 on a local Mac runner,
    # whatever its share of memory. Each worker grows past 1 GiB as it runs
    # more suites. On a local Mac runner the default peaked at 7.3 GiB and got
    # workers SIGKILLed (DEV-12386). On the Mac fleet, where every job has to
    # fit in about 5.5 GB (DEV-12779), this job peaked at 7.5 GB with the
    # default and at 3.8 GB with these flags. Capping workers alone barely
    # helps: 7 workers peaked at 7.1 GiB. `workerIdleMemoryLimit` restarts a
    # worker between test files once its heap passes the limit, so the cap
    # holds as the suite grows.
    SERVER_JEST_WORKER_LIMIT_ARGS: "--maxWorkers=4 --workerIdleMemoryLimit=512MB"
  script:
    - !reference [.build_shared_types, script]
    - cd server
    - !reference [.use_nvm, script]
    - yarn prettier:check
    - yarn lint-strict
    - yarn typecheck
    - yarn test ${SERVER_JEST_WORKER_LIMIT_ARGS} --reporters=default --reporters=jest-junit
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "export const BUILD_VERSION = '$BUILD_VERSION';" > src/version.ts
    - echo "Labelling this build as $BUILD_VERSION"
    - yarn build
  artifacts:
    when: always
    reports:
      junit: "server/junit.xml"
    paths:
      - server/dist
    expire_in: 1 hour
  cache: !reference [.caches, server]

build and test server:
  extends: .build-and-test-server
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server]
    - !reference [.rules, on_merge_to_master]

.integration-test-server:
  stage: build and test
  interruptible: true
  tags: !reference [.runner_tags, high_memory]
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: scratchpaper
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/scratchpaper"
  script:
    - !reference [.build_shared_types, script]
    - cd server
    - !reference [.use_nvm, script]
    - yarn run migrate
    - yarn run test:integration --verbose --reporters=default --reporters=jest-junit
  artifacts:
    when: always
    reports:
      junit: "server/junit.xml"
    expire_in: 1 week
  cache: !reference [.caches, server]

integration test server:
  extends: .integration-test-server
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server]
    - !reference [.rules, on_merge_to_master]

# Green-light gate (DEV-10008 sync-mapping v1 → v2 migration). Runs ONLY the
# v1-compat regression spec, which proves that existing v1 `Sync.mappings` run
# byte-for-byte identically through the v2-internal executor (Pass 3 is a no-op
# for v1 syncs). A green run here is the explicit precondition for proceeding
# with the v1 → v2 rollout — keeping the signal isolated from the broader
# integration suite so a v1-compat regression is unambiguous and fast to spot.
sync_v1_compat:
  extends: .integration-test-server
  script:
    - !reference [.build_shared_types, script]
    - cd server
    - !reference [.use_nvm, script]
    - yarn run migrate
    - yarn run test:integration sync-mapping-v1-compat --verbose --reporters=default --reporters=jest-junit
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server]
    - !reference [.rules, on_merge_to_master]

# MySQL connector (DEV-12035): runs ONLY server/test/integration/mysql-*.spec.ts against real MySQL 8.4 and
# MariaDB 11.4 sidecars. A dedicated job (precedent: sync_v1_compat) instead of sidecars on .integration-test-server:
# the MySQL specs skip themselves when MYSQL_TEST_URL / MARIADB_TEST_URL are unset, so the main job and the post-deploy
# environment tests never need these containers. `extends` REPLACES arrays, so `services` restates the app Postgres;
# `variables` deep-merge with the template's POSTGRES_* / DATABASE_URL. Per-service variables keep MYSQL_* off the
# MariaDB container (it also honours the MYSQL_* aliases).
.integration-test-server-mysql:
  extends: .integration-test-server
  services:
    - name: postgres:16
      alias: postgres
    - name: mysql:8.4
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: test_db
        MYSQL_USER: test
        MYSQL_PASSWORD: test
      command:
        # 8.4 ships mysql_native_password disabled; the specs exercise both auth plugins.
        - "--mysql-native-password=ON"
        # Lets root LOAD_FILE() the auto-generated /var/lib/mysql/ca.pem for the VERIFY_CA test
        # (GitLab services can't bind-mount repo files).
        - "--secure-file-priv="
    - name: mariadb:11.4
      alias: mariadb
      variables:
        MARIADB_ROOT_PASSWORD: root
        MARIADB_DATABASE: test_db
        MARIADB_USER: test
        MARIADB_PASSWORD: test
  variables:
    MYSQL_TEST_URL: "mysql://test:test@mysql:3306/test_db"
    MYSQL_TEST_ROOT_URL: "mysql://root:root@mysql:3306/test_db"
    MARIADB_TEST_URL: "mysql://test:test@mariadb:3306/test_db"
    MARIADB_TEST_ROOT_URL: "mysql://root:root@mariadb:3306/test_db"
    # Fail instead of self-skipping if either flavor is unconfigured, so a broken job can't pass green.
    MYSQL_INTEGRATION_FAIL_IF_UNCONFIGURED: "true"
  script:
    - !reference [.build_shared_types, script]
    - cd server
    - !reference [.use_nvm, script]
    - yarn run migrate
    - yarn run test:integration test/integration/mysql- --verbose --reporters=default --reporters=jest-junit

integration test server mysql:
  extends: .integration-test-server-mysql
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server]
    - !reference [.rules, on_merge_to_master]

.build-server-docker-image:
  stage: build and test
  tags: !reference [.runner_tags, high_memory]
  variables:
    # See the note on .build-client-docker-image-for-test.
    DOCKER_BUILD_PLATFORM_ARGS: "--platform linux/amd64"
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - server/image.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    - >
      docker build
      ${DOCKER_BUILD_PLATFORM_ARGS}
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      -t spinner/spinner-server
      -f server/Dockerfile.monorepo .
    - docker save spinner/spinner-server > server/image.tar

build server docker image:
  extends: .build-server-docker-image
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server-docker]
    - !reference [.rules, on_merge_to_master]
    - !reference [.rules, on_merge_to_prod]

# =============================================================================
# SCRATCH-GIT SUBPROJECT
# =============================================================================

.build-and-test-scratch-git:
  stage: build and test
  # `cargo test` runs native, on whatever architecture the host happens to be.
  # The release binary is different: `build scratch-git docker image` COPYs it
  # straight into a linux/amd64 image that runs on an x86 GCE VM, so on the
  # shared runners it is ALWAYS x86-64 — natively on an x86-64 host,
  # cross-compiled on anything else (see SCRATCH_GIT_RELEASE_FOR_AMD64 in the
  # script below). `local build and test scratch-git` opts out and stays fully
  # native: its binary only feeds a native-arch image that is never pushed.
  tags: !reference [.runner_tags, high_memory]
  image: rust:slim-bookworm
  interruptible: true
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
    CARGO_INCREMENTAL: "0"
    SCRATCH_GIT_RELEASE_FOR_AMD64: "true"
  cache:
    - !reference [.caches, cargo]
  artifacts:
    paths:
      - scratch-git-2/target/release/scratch-git-2
    expire_in: 1 hour
  before_script:
    - apt-get update && apt-get install -y pkg-config libssl-dev git git-restore-mtime && rm -rf /var/lib/apt/lists/*
    - git -C "${CI_PROJECT_DIR}" restore-mtime
  script:
    - command -v git && git --version
    - cd scratch-git-2
    # Cargo runs one rustc per CPU, and the container sees all of its machine's
    # CPUs (10 to 12 on the Mac fleet), whatever its share of memory. On the
    # Mac fleet every job has to fit in about 5.5 GB (DEV-12779). From a cold
    # target directory, building and linking the test binaries peaked at
    # 5.7 GB with 12 rustc processes and at 4.3 GB with 4. The release build
    # below peaks at about 1.6 GB, so it keeps one rustc per CPU.
    - cargo test --jobs 4
    # `apt-get update` because before_script deleted /var/lib/apt/lists/*. The
    # CC_/AR_ exports are required on top of the linker: ring, libsqlite3-sys
    # (bundled), zstd-sys, lzma-sys and bzip2-sys all compile C through the `cc`
    # crate, which otherwise reaches for the host compiler.
    - |
      if [ "$SCRATCH_GIT_RELEASE_FOR_AMD64" = "true" ] && [ "$(uname -m)" != "x86_64" ]; then
        apt-get update && apt-get install -y gcc-x86-64-linux-gnu libc6-dev-amd64-cross
        rustup target add x86_64-unknown-linux-gnu
        export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=x86_64-linux-gnu-gcc
        export CC_x86_64_unknown_linux_gnu=x86_64-linux-gnu-gcc
        export AR_x86_64_unknown_linux_gnu=x86_64-linux-gnu-ar
        cargo build --release --bin scratch-git-2 --target x86_64-unknown-linux-gnu
        # Same path the Dockerfile COPYs from and the image job's ELF check reads.
        cp target/x86_64-unknown-linux-gnu/release/scratch-git-2 target/release/scratch-git-2
      else
        cargo build --release --bin scratch-git-2
      fi

build and test scratch-git:
  extends: .build-and-test-scratch-git
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, scratch-git]
    - !reference [.rules, on_merge_to_master]
    - !reference [.rules, on_merge_to_prod]

# Warm both fallback caches (native + cross) on every merge to master.
# Release jobs and MR pipelines fall back to these keys when the Cargo.lock-hash
# miss. Writes to both keys so a cold cache warms whichever job runs next.
fill fallback cache for scratch-git-2:
  stage: cleanup
  tags: !reference [.runner_tags, high_memory]
  image: rust:slim-bookworm
  interruptible: true
  allow_failure: true
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  cache:
    - key: scratch-git-2-cargo
      unprotect: true
      paths: !reference [.caches, cargo, paths]
      policy: pull-push
  script:
    - cd scratch-git-2
    # Native build warms the `cargo` fallback (target/{debug,release}).
    - cargo build --release
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

fill fallback cross-compile cache for scratch-git-2:
  stage: cleanup
  tags: !reference [.runner_tags, high_memory]
  image: unawareguitar/hasty-dolphin:latest
  interruptible: true
  allow_failure: true
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  cache:
    - key: scratch-git-2-cargo-cross
      unprotect: true
      paths: !reference [.caches, cargo_cross, paths]
      policy: pull-push
  script:
    - cd scratch-git-2
    # Thin LTO + many codegen units produces ~2.9k object files; lld opens them
    # all at link time and trips the default RLIMIT_NOFILE (1024).
    - ulimit -n 65536
    # Cross builds warm the `cargo_cross` fallback (target/<triple>).
    - cargo zigbuild --release --target aarch64-apple-darwin
    - cargo zigbuild --release --target x86_64-unknown-linux-gnu
    - cargo zigbuild --release --target x86_64-pc-windows-gnu
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

.build-scratch-git-docker-image:
  stage: build and test
  tags: !reference [.runner_tags, high_memory]
  variables:
    # See the note on .build-client-docker-image-for-test.
    DOCKER_BUILD_PLATFORM_ARGS: "--platform linux/amd64"
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - scratch-git-2/image.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    # This Dockerfile COPYs a prebuilt binary rather than compiling in-image, and
    # COPY happily drops an aarch64 ELF into a linux/amd64 image — the build
    # passes and the container then dies at startup with "exec format error".
    # When we pin a platform, check the binary agrees with it by reading the ELF
    # header's e_machine field (offset 0x12, little-endian). Nothing to check
    # when DOCKER_BUILD_PLATFORM_ARGS is empty: the image is built for the same
    # host arch that just produced the binary.
    - |
      case "${DOCKER_BUILD_PLATFORM_ARGS}" in
        *linux/amd64) expected_elf_machine_for_target_platform=3e00 ;;
        *linux/arm64) expected_elf_machine_for_target_platform=b700 ;;
        *)            expected_elf_machine_for_target_platform= ;;
      esac
      if [ -n "$expected_elf_machine_for_target_platform" ]; then
        path_of_prebuilt_scratch_git_binary=scratch-git-2/target/release/scratch-git-2
        elf_machine_of_prebuilt_binary=$(od -An -t x1 -j 18 -N 2 "$path_of_prebuilt_scratch_git_binary" | tr -d ' \n')
        if [ "$elf_machine_of_prebuilt_binary" != "$expected_elf_machine_for_target_platform" ]; then
          echo "error: $path_of_prebuilt_scratch_git_binary has ELF e_machine 0x${elf_machine_of_prebuilt_binary},"
          echo "but this image is built with '${DOCKER_BUILD_PLATFORM_ARGS}' (expected 0x${expected_elf_machine_for_target_platform})."
          echo "The binary comes from 'build and test scratch-git', which builds x86-64 when"
          echo "SCRATCH_GIT_RELEASE_FOR_AMD64 is 'true' (cross-compiling if the host is not x86-64),"
          echo "and native to the host when it is 'false'."
          echo "Baking a mismatched binary in would produce an image that dies with 'exec format error'."
          exit 1
        fi
      fi
    - >
      docker build
      ${DOCKER_BUILD_PLATFORM_ARGS}
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      -t spinner/spinner-scratch-git
      -f scratch-git-2/Dockerfile .
    - docker save spinner/spinner-scratch-git > scratch-git-2/image.tar

build scratch-git docker image:
  extends: .build-scratch-git-docker-image
  needs:
    - job: build and test scratch-git
      artifacts: true
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, scratch-git-docker]
    - !reference [.rules, on_merge_to_master]
    - !reference [.rules, on_merge_to_prod]

# =============================================================================
# SCRATCH-DESKTOP SUBPROJECT
# =============================================================================

.build-and-test-scratch-desktop:
  stage: build and test
  interruptible: true
  tags: !reference [.runner_tags, high_memory]
  script:
    - !reference [.build_shared_types, script]
    - cd scratch-desktop
    - !reference [.use_nvm, script]
    - yarn prettier:check
    - yarn lint-strict
    - yarn typecheck
    - yarn test
    - yarn build

build and test scratch-desktop:
  extends: .build-and-test-scratch-desktop
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, scratch-desktop]
    # Desktop isn't under active development (DEV-12734), so on master this only
    # runs when the merge touched the desktop app or shared-types. Merges are
    # squashed, so a master push pipeline diffs against the previous commit,
    # which is exactly the merged MR.
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'
      changes: !reference [.changes, scratch-desktop]

# =============================================================================
# MISC
# =============================================================================

# The scheduled master->prod merge (stages/02-push-to-prod.yml) lists the merged
# commit summaries in the merge commit body. This renders that body
# ($CI_COMMIT_DESCRIPTION) into $COMMIT_LIST_SLACK as Slack blockquote lines,
# escaped for Slack markup and for embedding in the JSON payload. Empty when the
# commit has no body (e.g. a hand-pushed prod commit).
#
# The list is capped at $COMMIT_LIST_MAX_LINES with an "…and N more" tail: a
# release that has been held for weeks can carry hundreds of commits, which is
# unreadable in Slack and can blow past Slack's 40k-character `text` limit —
# which would fail the whole notification rather than just truncate it.
.render_commit_list:
  script:
    - |
      COMMIT_LIST_MAX_LINES="${COMMIT_LIST_MAX_LINES:-25}"
      COMMIT_LIST_ESCAPED=$(printf '%s' "${CI_COMMIT_DESCRIPTION}" \
        | sed -e 's/\\/\\\\/g' -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
              -e 's/"/\\"/g' -e '/^$/d')
      COMMIT_LIST_TOTAL_COUNT=$(printf '%s\n' "${COMMIT_LIST_ESCAPED}" | sed -e '/^$/d' | wc -l | tr -d ' ')
      COMMIT_LIST_SLACK=$(printf '%s\n' "${COMMIT_LIST_ESCAPED}" | sed -e '/^$/d' \
        | head -n "${COMMIT_LIST_MAX_LINES}" | sed -e 's/^/>/' -e 's/$/\\n/' | tr -d '\n')
      if [ "${COMMIT_LIST_TOTAL_COUNT}" -gt "${COMMIT_LIST_MAX_LINES}" ]; then
        COMMIT_LIST_SLACK="${COMMIT_LIST_SLACK}>…and $((COMMIT_LIST_TOTAL_COUNT - COMMIT_LIST_MAX_LINES)) more\\n"
      fi

# Same Slack channel / format as desktop 'release started' + deploy notifications
# (scratch-desktop/.gitlab-ci-release.yml, 05-deploy.yml). Runs in this stage
# so the team sees prod builds as soon as build-and-test work begins.
.notify_slack_prod_release_pipeline_started:
  stage: build and test
  allow_failure: true
  dependencies: []
  script:
    - !reference [.render_commit_list, script]
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"${SLACK_PROD_PIPELINE_STARTED_PREFIX} Scratch production release build started — ${CI_COMMIT_SHORT_SHA}\n>${CI_COMMIT_TITLE}\n${COMMIT_LIST_SLACK}<${CI_PIPELINE_URL}|View Pipeline> | <https://gitlab.com/whalesync/spinner/-/commit/${CI_COMMIT_SHA}|View Commit>\"}" \
      "${SLACK_SCRATCH_PROD_FEED_WEBHOOK_URL}"

notify slack prod release pipeline started:
  extends: .notify_slack_prod_release_pipeline_started
  variables:
    SLACK_PROD_PIPELINE_STARTED_PREFIX: "🚀"
  rules:
    - !reference [.rules, on_merge_to_prod]

# =============================================================================
# TEST POWER
# =============================================================================
#
# Wakes test before anything in this pipeline uses it, since the "Pause test env"
# schedule pauses it every night (gitlab-ci/test-power.yml). It changes nothing
# when test is already up. The test migrations, deploys, and post-deploy
# environment tests have no `needs:`, so they wait for this whole stage, wake
# included.
wake test:
  extends: .wake_test
  rules:
    # The pipelines that deploy test, the same as the test deploy jobs.
    - !reference [.rules, on_merge_to_master]
    # The scheduled CLI tests run against test; `cli integration tests` needs
    # this job.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_NAME == "Scheduled CLI Tests"'

# ⚠️  DO NOT set the dummy job to `when: manual`. Vanta requires a pipeline to
# run and pass before every MR is merged. A manual job is too easy to skip,
# which would violate that compliance requirement.
.dummy-job:
  stage: build and test
  interruptible: true
  allow_failure: true
  image:
  script:
    - echo "Gitlab won't merge a MR with changes only in these directories, since that doesn't trigger any pipelines"

dummy job:
  extends: .dummy-job
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: '$CI_COMMIT_BRANCH != "master" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'
      changes: !reference [.changes, dummy]
