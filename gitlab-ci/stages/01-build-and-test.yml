include:
  - "/gitlab-ci/stages.yml"
  - "/gitlab-ci/common.yml"

# =============================================================================
# CLIENT SUBPROJECT
# =============================================================================

.build-and-test-client:
  stage: build and test
  interruptible: true
  script:
    - !reference [.build_shared_types, script]
    - cd client
    - !reference [.use_nvm, script]
    - yarn lint-strict
    - yarn test
    - export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY_DEVELOPMENT
    - yarn build
  artifacts:
    paths:
      - client/.next
    expire_in: 1 hour

build and test client:
  extends: .build-and-test-client
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, client]
    - !reference [.rules, on_merge_to_master]

.build-client-docker-image-for-test:
  stage: build and test
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - client/image-test.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    # Environment-specific .env flags are set here.
    # Service-type flags are set in terraform on launch.
    - >
      docker build
      --build-arg APP_ENV=test
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      --build-arg CLERK_PUBLISHABLE_KEY="${CLERK_PUBLISHABLE_KEY_DEVELOPMENT}"
      --build-arg NEXT_PUBLIC_POSTHOG_KEY="${POSTHOG_KEY_DEVELOPMENT}"
      --build-arg NEXT_PUBLIC_POSTHOG_HOST="https://us.i.posthog.com"
      --build-arg NEXT_PUBLIC_API_URL=https://test-api.scratch.md
      --build-arg POSTHOG_PROJECT_ID="${POSTHOG_PROJECT_ID_TEST}"
      --build-arg POSTHOG_CLI_API_KEY="${POSTHOG_CLI_API_KEY_TEST}"
      -t spinner/spinner-client-test
      -f client/Dockerfile.monorepo .
    - docker save spinner/spinner-client-test > client/image-test.tar

build client docker image for test:
  extends: .build-client-docker-image-for-test
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, client-docker]
    - !reference [.rules, on_merge_to_master]

build client docker image for production:
  stage: build and test
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - client/image-production.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    # Environment-specific .env flags are set here.
    # Service-type flags are set in terraform on launch.
    - >
      docker build
      --build-arg APP_ENV=production
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      --build-arg CLERK_PUBLISHABLE_KEY="${CLERK_PUBLISHABLE_KEY_PRODUCTION}"
      --build-arg NEXT_PUBLIC_POSTHOG_KEY="${POSTHOG_KEY}"
      --build-arg NEXT_PUBLIC_POSTHOG_HOST="https://us.i.posthog.com"
      --build-arg NEXT_PUBLIC_API_URL=https://api.scratch.md
      --build-arg NEXT_PUBLIC_GA_ID=G-GVXSMCZ3JR
      --build-arg POSTHOG_PROJECT_ID="${POSTHOG_PROJECT_ID_PRODUCTION}"
      --build-arg POSTHOG_CLI_API_KEY="${POSTHOG_CLI_API_KEY_PRODUCTION}"
      -t spinner/spinner-client-production
      -f client/Dockerfile.monorepo .
    - docker save spinner/spinner-client-production > client/image-production.tar
  rules:
    - !reference [.rules, on_merge_to_prod]

# =============================================================================
# SERVER SUBPROJECT
# =============================================================================

.build-and-test-server:
  stage: build and test
  interruptible: true
  script:
    - !reference [.build_shared_types, script]
    - cd server
    - !reference [.use_nvm, script]
    - yarn lint-strict
    - yarn test --reporters=default --reporters=jest-junit
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "export const BUILD_VERSION = '$BUILD_VERSION';" > src/version.ts
    - echo "Labelling this build as $BUILD_VERSION"
    - yarn build
  artifacts:
    when: always
    reports:
      junit: "server/junit.xml"
    paths:
      - server/dist
    expire_in: 1 hour
  cache: !reference [.caches, server]

build and test server:
  extends: .build-and-test-server
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server]
    - !reference [.rules, on_merge_to_master]

.integration-test-server:
  stage: build and test
  interruptible: true
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: scratchpaper
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/scratchpaper"
  script:
    - !reference [.build_shared_types, script]
    - cd server
    - !reference [.use_nvm, script]
    - yarn run migrate
    - yarn run test:integration --verbose --reporters=default --reporters=jest-junit
  artifacts:
    when: always
    reports:
      junit: "server/junit.xml"
    expire_in: 1 week
  cache: !reference [.caches, server]

integration test server:
  extends: .integration-test-server
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server]
    - !reference [.rules, on_merge_to_master]

.build-server-docker-image:
  stage: build and test
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - server/image.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    - >
      docker build
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      -t spinner/spinner-server
      -f server/Dockerfile.monorepo .
    - docker save spinner/spinner-server > server/image.tar

build server docker image:
  extends: .build-server-docker-image
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server-docker]
    - !reference [.rules, on_merge_to_master]
    - !reference [.rules, on_merge_to_prod]

# =============================================================================
# SCRATCH-GIT SUBPROJECT
# =============================================================================

.build-and-test-scratch-git:
  stage: build and test
  image: rust:slim-bookworm
  interruptible: true
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  cache:
    - !reference [.caches, cargo]
  artifacts:
    paths:
      - scratch-git-2/target/release/scratch-git-2
    expire_in: 1 hour
  script:
    - apt-get update && apt-get install -y pkg-config libssl-dev git && rm -rf /var/lib/apt/lists/*
    - command -v git && git --version
    - cd scratch-git-2
    - cargo test
    - cargo build --release --bin scratch-git-2

build and test scratch-git:
  extends: .build-and-test-scratch-git
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, scratch-git]
    - !reference [.rules, on_merge_to_master]
    - !reference [.rules, on_merge_to_prod]

# Warm both fallback caches (native + cross) on every merge to master.
# Release jobs and MR pipelines fall back to these keys when the Cargo.lock-hash
# miss. Writes to both keys so a cold cache warms whichever job runs next.
fill fallback cache for scratch-git-2:
  stage: cleanup
  image: rust:slim-bookworm
  interruptible: true
  allow_failure: true
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  cache:
    - key: scratch-git-2-cargo
      unprotect: true
      paths: !reference [.caches, cargo, paths]
      policy: pull-push
  script:
    - cd scratch-git-2
    # Native build warms the `cargo` fallback (target/{debug,release}).
    - cargo build --release
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

fill fallback cross-compile cache for scratch-git-2:
  stage: cleanup
  image: unawareguitar/hasty-dolphin:latest
  interruptible: true
  allow_failure: true
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  cache:
    - key: scratch-git-2-cargo-cross
      unprotect: true
      paths: !reference [.caches, cargo_cross, paths]
      policy: pull-push
  script:
    - cd scratch-git-2
    # Cross builds warm the `cargo_cross` fallback (target/<triple>).
    - cargo zigbuild --release --target aarch64-apple-darwin
    - cargo zigbuild --release --target x86_64-unknown-linux-gnu
    - cargo zigbuild --release --target x86_64-pc-windows-gnu
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

.build-scratch-git-docker-image:
  stage: build and test
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - scratch-git-2/image.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    - >
      docker build
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      -t spinner/spinner-scratch-git
      -f scratch-git-2/Dockerfile .
    - docker save spinner/spinner-scratch-git > scratch-git-2/image.tar

build scratch-git docker image:
  extends: .build-scratch-git-docker-image
  needs:
    - job: build and test scratch-git
      artifacts: true
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, scratch-git-docker]
    - !reference [.rules, on_merge_to_master]
    - !reference [.rules, on_merge_to_prod]

# =============================================================================
# SCRATCH-DESKTOP SUBPROJECT
# =============================================================================

.build-and-test-scratch-desktop:
  stage: build and test
  interruptible: true
  script:
    - !reference [.build_shared_types, script]
    - cd scratch-desktop
    - !reference [.use_nvm, script]
    - yarn lint-strict
    - yarn build

build and test scratch-desktop:
  extends: .build-and-test-scratch-desktop
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, scratch-desktop]
    - !reference [.rules, on_merge_to_master]

# =============================================================================
# MISC
# =============================================================================

# Same Slack channel / format as desktop 'release started' + deploy notifications
# (scratch-desktop/.gitlab-ci-release.yml, 05-deploy.yml). Runs in this stage
# so the team sees prod builds as soon as build-and-test work begins.
.notify_slack_prod_release_pipeline_started:
  stage: build and test
  allow_failure: true
  dependencies: []
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"${SLACK_PROD_PIPELINE_STARTED_PREFIX} Scratch production release build started — ${CI_COMMIT_SHORT_SHA}\n>${CI_COMMIT_TITLE}\n<${CI_PIPELINE_URL}|View Pipeline> | <https://gitlab.com/whalesync/spinner/-/commit/${CI_COMMIT_SHA}|View Commit>\"}" \
      "${SLACK_SCRATCH_PROD_FEED_WEBHOOK_URL}"

notify slack prod release pipeline started:
  extends: .notify_slack_prod_release_pipeline_started
  variables:
    SLACK_PROD_PIPELINE_STARTED_PREFIX: '🚀'
  rules:
    - !reference [.rules, on_merge_to_prod]

# ⚠️  DO NOT set the dummy job to `when: manual`. Vanta requires a pipeline to
# run and pass before every MR is merged. A manual job is too easy to skip,
# which would violate that compliance requirement.
.dummy-job:
  stage: build and test
  interruptible: true
  allow_failure: true
  image:
  script:
    - echo "Gitlab won't merge a MR with changes only in these directories, since that doesn't trigger any pipelines"

dummy job:
  extends: .dummy-job
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: '$CI_COMMIT_BRANCH != "master" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'
      changes: !reference [.changes, dummy]
