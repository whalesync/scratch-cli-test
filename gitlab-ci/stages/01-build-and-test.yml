include:
  - "/gitlab-ci/stages.yml"
  - "/gitlab-ci/common.yml"

# =============================================================================
# Shared change-sets — referenced by both normal and local-runner jobs
# =============================================================================

.changes:
  client:
    - client/**/*
    - packages/**/*
  client-docker:
    - client/Dockerfile.monorepo
  server:
    - server/**/*
    - packages/**/*
    - test-api-fakes/**/*
  server-docker:
    - server/Dockerfile.monorepo
  scratch-cli:
    - scratch-cli/**/*
  scratch-git:
    - scratch-git-2/**/*
  scratch-git-docker:
    - scratch-git-2/Dockerfile
  build-and-test:
    - gitlab-ci/stages/01-build-and-test.yml
  push-images:
    - gitlab-ci/stages/03-push-images.yml
  dummy:
    - terraform/**/*
    - .cursor/**/*
    - gitlab-ci/**/*
    - .vscode/**/*
    - experimental/**/*
    - scratch-git-2/**/*
    - scratch-git-tests/**/*
    - "*"
    - docs/**/*

# =============================================================================
# Local runner user list
#
# This skips the shared-runner MR jobs for local-runner users so they don't
# get duplicate runs. See gitlab-ci/local-runners.yml for the local variants.
# =============================================================================

# ✏️  ADD YOUR USERNAME HERE (2 of 2 — you must also update
#    .rules.local_runner_users in gitlab-ci/local-runners.yml)
.rules:
  skip_for_local_runner_users:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_USER_LOGIN =~ /^(cfonger|ryderziola|choefgen|luciocesolari|rob324)$/'
      when: never

# =============================================================================
# CLIENT SUBPROJECT
# =============================================================================

.build-and-test-client:
  stage: build and test
  interruptible: true
  script:
    - !reference [.build_shared_types, script]
    - cd client
    - !reference [.use_nvm, script]
    - yarn lint-strict
    - yarn test
    - export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY_DEVELOPMENT
    - yarn build
  artifacts:
    paths:
      - client/.next
    expire_in: 1 hour

build and test client:
  extends: .build-and-test-client
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, client]
    - !reference [.rules, on_merge_to_master]

.build-client-docker-image-for-test:
  stage: build and test
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - client/image-test.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    # Environment-specific .env flags are set here.
    # Service-type flags are set in terraform on launch.
    - >
      docker build
      --build-arg APP_ENV=test
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      --build-arg CLERK_PUBLISHABLE_KEY="${CLERK_PUBLISHABLE_KEY_DEVELOPMENT}"
      --build-arg NEXT_PUBLIC_POSTHOG_KEY="${POSTHOG_KEY_DEVELOPMENT}"
      --build-arg NEXT_PUBLIC_POSTHOG_HOST="https://us.i.posthog.com"
      --build-arg NEXT_PUBLIC_API_URL=https://test-api.scratch.md
      --build-arg POSTHOG_PROJECT_ID="${POSTHOG_PROJECT_ID_TEST}"
      --build-arg POSTHOG_CLI_API_KEY="${POSTHOG_CLI_API_KEY_TEST}"
      -t spinner/spinner-client-test
      -f client/Dockerfile.monorepo .
    - docker save spinner/spinner-client-test > client/image-test.tar

build client docker image for test:
  extends: .build-client-docker-image-for-test
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, client-docker]
    - !reference [.rules, on_merge_to_master]

build client docker image for production:
  stage: build and test
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - client/image-production.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    # Environment-specific .env flags are set here.
    # Service-type flags are set in terraform on launch.
    - >
      docker build
      --build-arg APP_ENV=production
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      --build-arg CLERK_PUBLISHABLE_KEY="${CLERK_PUBLISHABLE_KEY_PRODUCTION}"
      --build-arg NEXT_PUBLIC_POSTHOG_KEY="${POSTHOG_KEY}"
      --build-arg NEXT_PUBLIC_POSTHOG_HOST="https://us.i.posthog.com"
      --build-arg NEXT_PUBLIC_API_URL=https://api.scratch.md
      --build-arg NEXT_PUBLIC_GA_ID=G-GVXSMCZ3JR
      --build-arg POSTHOG_PROJECT_ID="${POSTHOG_PROJECT_ID_PRODUCTION}"
      --build-arg POSTHOG_CLI_API_KEY="${POSTHOG_CLI_API_KEY_PRODUCTION}"
      -t spinner/spinner-client-production
      -f client/Dockerfile.monorepo .
    - docker save spinner/spinner-client-production > client/image-production.tar
  rules:
    - !reference [.rules, on_merge_to_prod]

# =============================================================================
# SERVER SUBPROJECT
# =============================================================================

.build-and-test-server:
  stage: build and test
  interruptible: true
  script:
    - !reference [.build_shared_types, script]
    - cd server
    - !reference [.use_nvm, script]
    - yarn lint-strict
    - yarn test --reporters=default --reporters=jest-junit
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "export const BUILD_VERSION = '$BUILD_VERSION';" > src/version.ts
    - echo "Labelling this build as $BUILD_VERSION"
    - yarn build
  artifacts:
    when: always
    reports:
      junit: "server/junit.xml"
    paths:
      - server/dist
    expire_in: 1 hour
  cache: !reference [.caches, server]

build and test server:
  extends: .build-and-test-server
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server]
    - !reference [.rules, on_merge_to_master]

.integration-test-server:
  stage: build and test
  interruptible: true
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: scratchpaper
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/scratchpaper"
  script:
    - !reference [.build_shared_types, script]
    - cd server
    - !reference [.use_nvm, script]
    - yarn run migrate
    - yarn run test:integration --verbose --reporters=default --reporters=jest-junit
  artifacts:
    when: always
    reports:
      junit: "server/junit.xml"
    expire_in: 1 week
  cache: !reference [.caches, server]

integration test server:
  extends: .integration-test-server
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server]
    - !reference [.rules, on_merge_to_master]

.build-server-docker-image:
  stage: build and test
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - server/image.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    - >
      docker build
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      -t spinner/spinner-server
      -f server/Dockerfile.monorepo .
    - docker save spinner/spinner-server > server/image.tar

build server docker image:
  extends: .build-server-docker-image
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, server-docker]
    - !reference [.rules, on_merge_to_master]
    - !reference [.rules, on_merge_to_prod]

# =============================================================================
# SCRATCH-CLI SUBPROJECT
# =============================================================================

.build-and-test-scratch-cli:
  stage: build and test
  image: golang:1.25
  interruptible: true
  variables:
    GOFLAGS: "-buildvcs=false"
  script:
    - cd scratch-cli
    - go clean -cache -modcache 2>/dev/null || true
    - echo "Checking code formatting"
    - test -z "$(gofmt -l .)" || (echo "Code is not formatted. Run 'gofmt -w .'" && gofmt -l . && exit 1)
    - echo "Building scratch-cli"
    - go build -o scratchmd ./cmd/scratchmd
    - echo "Testing executable"
    - ./scratchmd --help

build and test scratch-cli:
  extends: .build-and-test-scratch-cli
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, scratch-cli]
    - !reference [.rules, on_merge_to_master]

# =============================================================================
# SCRATCH-GIT SUBPROJECT
# =============================================================================

.build-and-test-scratch-git:
  stage: build and test
  image: rust:slim-bookworm
  interruptible: true
  cache:
    - key:
        files:
          - scratch-git-2/Cargo.lock
      fallback_keys:
        - scratch-git-2-cargo
      unprotect: true
      paths:
        - .cargo/registry/cache
        - .cargo/registry/index
        - scratch-git-2/target
      policy: pull-push
  script:
    - apt-get update && apt-get install -y pkg-config libssl-dev && rm -rf /var/lib/apt/lists/*
    - cd scratch-git-2
    - cargo test

build and test scratch-git:
  extends: .build-and-test-scratch-git
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, scratch-git]
    - !reference [.rules, on_merge_to_master]

# Warm the scratch-git-2-cargo fallback cache on every merge to master.
# Release jobs (on prod) use this key when Cargo.lock-hash misses.
warm-scratch-git-cargo-cache:
  stage: build and test
  image: rust:latest
  interruptible: true
  allow_failure: true
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
    ZIG_VERSION: "0.13.0"
  cache:
    - key: scratch-git-2-cargo
      unprotect: true
      paths:
        - .cargo/registry/cache
        - .cargo/registry/index
        - scratch-git-2/target
      policy: pull-push
    - key: cargo-zigbuild-${ZIG_VERSION}
      unprotect: true
      paths:
        - .cargo/bin/cargo-zigbuild
        - .zig
      policy: pull-push
  before_script:
    - apt-get update -qq && apt-get install -y zip
    # Install zig from official release (skip if cached)
    - |
      if [ -d ".zig/zig-linux-x86_64-${ZIG_VERSION}" ]; then
        echo "Using cached zig ${ZIG_VERSION}"
      else
        mkdir -p .zig
        curl -sL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ -C .zig
      fi
    - export PATH="${CI_PROJECT_DIR}/.zig/zig-linux-x86_64-${ZIG_VERSION}:$PATH"
    # Install cargo-zigbuild (skip if cached)
    - |
      if [ -f "${CARGO_HOME}/bin/cargo-zigbuild" ]; then
        echo "Using cached cargo-zigbuild"
      else
        cargo install cargo-zigbuild --quiet
      fi
    - export PATH="${CARGO_HOME}/bin:$PATH"
    - rustup target add
      aarch64-apple-darwin
      x86_64-unknown-linux-gnu
      x86_64-pc-windows-gnu
  script:
    - cd scratch-git-2
    - cargo zigbuild --release --bin scratchmd --target aarch64-apple-darwin
    - cargo zigbuild --release --bin scratchmd --target x86_64-unknown-linux-gnu
    - cargo zigbuild --release --bin scratchmd --target x86_64-pc-windows-gnu
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

.build-scratch-git-docker-image:
  stage: build and test
  extends:
    - .docker_builder_image
  cache: []
  services:
    - docker:26-dind
  artifacts:
    paths:
      - scratch-git-2/image.tar
    expire_in: 1 hour
  script:
    - BUILD_VERSION=`date +%y.%m.%d.%H.%M.$CI_COMMIT_SHORT_SHA`
    - echo "Labelling this build as $BUILD_VERSION"
    - >
      docker build
      --build-arg BUILD_VERSION="${BUILD_VERSION}"
      -t spinner/spinner-scratch-git
      -f scratch-git-2/Dockerfile .
    - docker save spinner/spinner-scratch-git > scratch-git-2/image.tar

build scratch-git docker image:
  extends: .build-scratch-git-docker-image
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.changes, scratch-git-docker]
    - !reference [.rules, on_merge_to_master]
    - !reference [.rules, on_merge_to_prod]

# =============================================================================
# MISC
# =============================================================================

.dummy-job:
  stage: build and test
  interruptible: true
  image:
  script:
    - echo "Gitlab won't merge a MR with changes only in these directories, since that doesn't trigger any pipelines"

dummy job:
  extends: .dummy-job
  rules:
    - !reference [.rules, skip_for_local_runner_users]
    - if: '$CI_COMMIT_BRANCH != "master" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'
      changes: !reference [.changes, dummy]
