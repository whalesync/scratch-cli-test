include:
  - "/gitlab-ci/stages.yml"
  - "/gitlab-ci/common.yml"

#region test env

# Test may be paused overnight, with its database stopped. This job has no
# `needs:`, so it waits for the build and test stage, which includes `wake test`
# (01-build-and-test.yml). If you give it a `needs:`, list `wake test` too.
run migrations on test environment:
  extends:
    - .gcp_eu_test_env # sets before_script and variables
  stage: run migrations
  cache: !reference [.caches, server]
  dependencies: []
  script:
    - pushd server
    - !reference [.use_nvm, script]
    - ./tools/run_database_migrations.sh eu-test
    - popd
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - gitlab-ci/stages/04-run-migrations.yml
      when: manual
      allow_failure: true
    - !reference [.rules, on_merge_to_master]

#endregion

#region production env

run migrations on production environment:
  extends:
    - .gcp_eu_production_env # sets before_script and variables
  stage: run migrations
  cache: !reference [.caches, server]
  dependencies: []
  script:
    - pushd server
    - !reference [.use_nvm, script]
    - ./tools/run_database_migrations.sh eu-production
    - popd
  rules:
    - !reference [.rules, on_merge_to_prod]
#endregion
