variables:
  # Node.js version for client and server
  NODE_VERSION: "22"
  # For GCP (EU region).
  GCP_REGION: "europe-west1"

  # For uv
  UV_VERSION: "0.9.18"
  UV_DOCKER_BASE_LAYER: bookworm-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

# default image used by all jobs unless overridden
image:
  name: unawareguitar/leaning-basket:e54db988
  #pull_policy: if-not-present

.docker_builder_image:
  image:
    name: unawareguitar/aws-dind:08dd8de0
    #pull_policy: if-not-present
  variables:
    DOCKER_TLS_CERTDIR: ""

# Any step can fetch GCP creds by extending from this rule.
# It will automatically fetch creds via OIDC and make them available as Application Default Credentials (ADC).
# Just add: extends: .google-oidc:auth
# NOTE! This breaks if you add a before_step to the step, since that clobbers the added work the rule adds.
include:
  - remote: "https://gitlab.com/gitlab-com/gl-security/security-operations/infrastructure-security-public/oidc-modules/-/raw/3.4.0/templates/gcp_auth.yaml"

.setup_docker_gcp_auth:
  script:
    - gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://${CLOUDSDK_RUN_REGION}-docker.pkg.dev

.use_nvm:
  script:
    # To get nvm working.
    - . ~/.bashrc
    - nvm use && yarn install --frozen-lockfile --cache-folder .yarn --prefer-offline

.build_shared_types:
  script:
    - cd packages/shared-types
    - !reference [.use_nvm, script]
    - yarn build
    - cd ../..

# Reusable snippet for including into rules to trigger jobs only on merge to master, not in MRs or scheduled pipelines
.rules:
  on_merge_to_master:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'
  on_merge_to_prod:
    - if: '$CI_COMMIT_BRANCH == "prod" && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'

# Extend this rule to include OIDC auth and all required settings for the EU test project
.gcp_eu_test_env:
  extends: .google-oidc:auth
  variables:
    TF_ROOT: "${CI_PROJECT_DIR}/terraform/envs/eu-test"
    AUDIENCE: "https://gitlab.com"
  before_script:
    - export GCP_OIDC_JWT_ORIG=$GCP_OIDC_JWT
    - export GCLOUD_PROJECT="spv1eu-test"
    - export GCP_PROJECT_NUMBER="491293505063"
    - export CLOUDSDK_RUN_REGION="europe-west1"
    - export GCP_REGISTRY="eu-test-registry"
    - export SERVICE_ACCOUNT="gitlab-service-account@spv1eu-test.iam.gserviceaccount.com"
    - export WI_POOL_PROVIDER="//iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/gitlab-oidc-pool/providers/gitlab-oidc-provider"
    - export GCP_REGISTRY_URL="europe-west1-docker.pkg.dev/${GCLOUD_PROJECT}/${GCP_REGISTRY}"
    - export TF_ROOT="${CI_PROJECT_DIR}/terraform/envs/eu-test"
    - !reference [.google-oidc:auth, before_script]

# Extend this rule to include OIDC auth and all required settings for the EU production project
.gcp_eu_production_env:
  extends: .google-oidc:auth
  variables:
    TF_ROOT: "${CI_PROJECT_DIR}/terraform/envs/eu-production"
    AUDIENCE: "https://gitlab.com"
  before_script:
    - export GCP_OIDC_JWT_ORIG=$GCP_OIDC_JWT
    - export GCLOUD_PROJECT="spv1eu-production"
    - export GCP_PROJECT_NUMBER="75080978117"
    - export CLOUDSDK_RUN_REGION="europe-west1"
    - export GCP_REGISTRY="eu-production-registry"
    - export SERVICE_ACCOUNT="gitlab-service-account@spv1eu-production.iam.gserviceaccount.com"
    - export WI_POOL_PROVIDER="//iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/gitlab-oidc-pool/providers/gitlab-oidc-provider"
    - export GCP_REGISTRY_URL="europe-west1-docker.pkg.dev/${GCLOUD_PROJECT}/${GCP_REGISTRY}"
    - export TF_ROOT="${CI_PROJECT_DIR}/terraform/envs/eu-production"
    - !reference [.google-oidc:auth, before_script]

.caches:
  shared_types:
    key:
      files:
        - packages/shared-types/yarn.lock
    paths:
      - packages/shared-types/node_modules
    unprotect: true
  server:
    key:
      files:
        - server/yarn.lock
    paths:
      - server/node_modules
    unprotect: true
  client:
    key:
      files:
        - client/yarn.lock
    paths:
      - client/node_modules
    unprotect: true
