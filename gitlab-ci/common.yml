variables:
  # Node.js version for client and server
  NODE_VERSION: "22"
  # For GCP (EU region).
  GCP_REGION: "europe-west1"

  # For uv
  UV_VERSION: "0.9.18"
  UV_DOCKER_BASE_LAYER: bookworm-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

# default image used by all jobs unless overridden
image:
  name: unawareguitar/leaning-basket:e54db988
  #pull_policy: if-not-present

.docker_builder_image:
  image:
    name: unawareguitar/aws-dind:08dd8de0
    #pull_policy: if-not-present
  variables:
    DOCKER_TLS_CERTDIR: ""

# Any step can fetch GCP creds by extending from this rule.
# It will automatically fetch creds via OIDC and make them available as Application Default Credentials (ADC).
# Just add: extends: .google-oidc:auth
# NOTE! This breaks if you add a before_step to the step, since that clobbers the added work the rule adds.
include:
  - remote: "https://gitlab.com/gitlab-com/gl-security/security-operations/infrastructure-security-public/oidc-modules/-/raw/3.4.0/templates/gcp_auth.yaml"

.setup_docker_gcp_auth:
  script:
    - gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://${CLOUDSDK_RUN_REGION}-docker.pkg.dev

.use_nvm:
  script:
    # To get nvm working.
    - . ~/.bashrc
    - nvm use && yarn install --frozen-lockfile --cache-folder .yarn --prefer-offline

.build_shared_types:
  script:
    - cd packages/shared-types
    - !reference [.use_nvm, script]
    - yarn build
    - cd ../..

# Reusable snippet for including into rules to trigger jobs only on merge to master, not in MRs or scheduled pipelines
.rules:
  on_merge_to_master:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'
  on_merge_to_prod:
    - if: '$CI_COMMIT_BRANCH == "prod" && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'

  # Local-runner opt-ins — defined here (not in local-runners.yml) so the
  # release pipeline can reference them even when local-runners.yml is excluded
  # via RELEASE_DESKTOP_ONLY / RELEASE_CLI_ONLY.
  # ✏️  ADD YOUR USERNAME HERE (1 of 2 — you must also update
  #    .rules.skip_for_local_runner_users in gitlab-ci/stages/01-build-and-test.yml)
  #    NOTE: update the list of users in ALL three rules below.
  local_runner_users_mr: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_USER_LOGIN =~ /^(cfonger|ryderziola|choefgen|rob324)$/'
  local_runner_users_master: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule" && $GITLAB_USER_LOGIN =~ /^(cfonger|ryderziola|choefgen|rob324)$/'
  local_runner_users_prod: '$CI_COMMIT_BRANCH == "prod" && $CI_PIPELINE_SOURCE != "schedule" && $GITLAB_USER_LOGIN =~ /^(cfonger|ryderziola|choefgen|rob324)$/'

  # Local runner user list
  #
  # This skips the shared-runner MR jobs for local-runner users so they don't
  # get duplicate runs. See gitlab-ci/local-runners.yml for the local variants.

  # ✏️  ADD YOUR USERNAME HERE (2 of 2 — you must also update
  #    .rules.local_runner_users_mr in gitlab-ci/local-runners.yml)
  skip_for_local_runner_users:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_USER_LOGIN =~ /^(cfonger|ryderziola|choefgen|rob324)$/'
      when: never

# =============================================================================
# Shared change-sets — referenced by both normal and local-runner jobs
# =============================================================================

.changes:
  client:
    - client/**/*
    - packages/**/*
  client-docker:
    - client/Dockerfile.monorepo
  server:
    - server/**/*
    - packages/**/*
    - test-api-fakes/**/*
  server-docker:
    - server/Dockerfile.monorepo
  scratch-git:
    - scratch-git-2/**/*
  scratch-git-docker:
    - scratch-git-2/Dockerfile
  build-and-test:
    - gitlab-ci/stages/01-build-and-test.yml
  push-images:
    - gitlab-ci/stages/03-push-images.yml
  scratch-desktop:
    - scratch-desktop/**/*
    - packages/**/*
  dummy:
    - terraform/**/*
    - .cursor/**/*
    - .claude/**/*
    - gitlab-ci/**/*
    - docs/**/*
    - .vscode/**/*
    - experimental/**/*
    - scratch-git-2/**/*
    - scratch-git-tests/**/*
    - scratch-cli-tests/**/*
    - scripts/**/*
    - "*"
    - docs/**/*

# Shell executor for macOS-native builds (e.g. .dmg packaging).
# Runs directly on the host — no Docker container. Requires Node 22, Yarn,
# and Git installed on the machine. See docs/local-gitlab-runner.md.
# Defined here (not in local-runners.yml) so the release pipeline's mac jobs
# can extend from it even when local-runners.yml is excluded via
# RELEASE_DESKTOP_ONLY / RELEASE_CLI_ONLY.
.local-macos-runner-defaults:
  tags:
    - "local-macos-$GITLAB_USER_LOGIN"
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 0
    GIT_CLEAN_FLAGS: "-ffdx -e node_modules -e .yarn -e .next"
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "============================================================"
        echo "  MACOS RUNNER: If this failure looks like missing tools,"
        echo "  ensure Node 22, Yarn, and Git are installed:"
        echo ""
        echo "    brew install node@22 yarn git"
        echo ""
        echo "  See docs/local-gitlab-runner.md for details."
        echo "============================================================"
      fi

# Extend this rule to include OIDC auth and all required settings for the EU test project
.gcp_eu_test_env:
  extends: .google-oidc:auth
  variables:
    TF_ROOT: "${CI_PROJECT_DIR}/terraform/envs/eu-test"
    AUDIENCE: "https://gitlab.com"
  before_script:
    - export GCP_OIDC_JWT_ORIG=$GCP_OIDC_JWT
    - export GCLOUD_PROJECT="spv1eu-test"
    - export GCP_PROJECT_NUMBER="491293505063"
    - export CLOUDSDK_RUN_REGION="europe-west1"
    - export GCP_REGISTRY="eu-test-registry"
    - export SERVICE_ACCOUNT="gitlab-service-account@spv1eu-test.iam.gserviceaccount.com"
    - export WI_POOL_PROVIDER="//iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/gitlab-oidc-pool/providers/gitlab-oidc-provider"
    - export GCP_REGISTRY_URL="europe-west1-docker.pkg.dev/${GCLOUD_PROJECT}/${GCP_REGISTRY}"
    - export TF_ROOT="${CI_PROJECT_DIR}/terraform/envs/eu-test"
    - !reference [.google-oidc:auth, before_script]

# Extend this rule to include OIDC auth and all required settings for the EU production project
.gcp_eu_production_env:
  extends: .google-oidc:auth
  variables:
    TF_ROOT: "${CI_PROJECT_DIR}/terraform/envs/eu-production"
    AUDIENCE: "https://gitlab.com"
  before_script:
    - export GCP_OIDC_JWT_ORIG=$GCP_OIDC_JWT
    - export GCLOUD_PROJECT="spv1eu-production"
    - export GCP_PROJECT_NUMBER="75080978117"
    - export CLOUDSDK_RUN_REGION="europe-west1"
    - export GCP_REGISTRY="eu-production-registry"
    - export SERVICE_ACCOUNT="gitlab-service-account@spv1eu-production.iam.gserviceaccount.com"
    - export WI_POOL_PROVIDER="//iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/gitlab-oidc-pool/providers/gitlab-oidc-provider"
    - export GCP_REGISTRY_URL="europe-west1-docker.pkg.dev/${GCLOUD_PROJECT}/${GCP_REGISTRY}"
    - export TF_ROOT="${CI_PROJECT_DIR}/terraform/envs/eu-production"
    - !reference [.google-oidc:auth, before_script]

.caches:
  shared_types:
    key:
      files:
        - packages/shared-types/yarn.lock
    paths:
      - packages/shared-types/node_modules
    unprotect: true
  server:
    key:
      files:
        - server/yarn.lock
    paths:
      - server/node_modules
    unprotect: true
  client:
    key:
      files:
        - client/yarn.lock
    paths:
      - client/node_modules
    unprotect: true
  # Cargo caches for scratch-git-2. Jobs consuming these MUST set
  # CARGO_HOME=${CI_PROJECT_DIR}/.cargo so cargo reads/writes the cached
  # registry.
  #
  # We split the native and cross-compile build outputs into separate caches so
  # jobs that cross-compile (cargo-zigbuild → multiple targets) don't overwrite
  # the native job's cache with a snapshot that's missing the host-triple
  # artifacts (and vice versa). Both caches carry the shared registry so either
  # one warms dep downloads for the other.
  #
  #   cargo         — native host builds       (scratch-git-2/target/{debug,release,...})
  #   cargo_cross   — zigbuild: per-triple dirs under target/<triple>/… **plus**
  #                   target/release — with `--target`, Cargo still puts host-only
  #                   artifacts (proc-macros, build-script outputs) in
  #                   target/release/, not under the host triple folder; omitting
  #                   that path makes every job recompile the full dependency graph.
  #
  # Use *_pull variants for readers that must not evict the writer's snapshot.
  cargo:
    key:
      files:
        - scratch-git-2/Cargo.lock
      prefix: "2" # manually increment this to clear caches
    fallback_keys:
      - scratch-git-2-cargo
    unprotect: true
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git
      - scratch-git-2/target/debug
      - scratch-git-2/target/release
      - scratch-git-2/target/.rustc_info.json
      - scratch-git-2/target/CACHEDIR.TAG
    policy: pull-push
  cargo_pull:
    key:
      files:
        - scratch-git-2/Cargo.lock
      prefix: "2" # manually increment this to clear caches
    fallback_keys:
      - scratch-git-2-cargo
    unprotect: true
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git
      - scratch-git-2/target/debug
      - scratch-git-2/target/release
      - scratch-git-2/target/.rustc_info.json
      - scratch-git-2/target/CACHEDIR.TAG
    policy: pull
  cargo_cross:
    key:
      files:
        - scratch-git-2/Cargo.lock
      prefix: cross
    fallback_keys:
      - scratch-git-2-cargo-cross
    unprotect: true
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git
      - scratch-git-2/target/release
      - scratch-git-2/target/aarch64-apple-darwin
      - scratch-git-2/target/x86_64-unknown-linux-gnu
      - scratch-git-2/target/x86_64-pc-windows-gnu
      - scratch-git-2/target/.rustc_info.json
      - scratch-git-2/target/CACHEDIR.TAG
    policy: pull-push
  # Isolated from .cargo / target used by other CI jobs (scheduled CLI integration
  # only). Jobs MUST set CARGO_HOME and CARGO_TARGET_DIR to the paths below.
  cargo_cli_integration:
    key:
      files:
        - scratch-git-2/Cargo.lock
      prefix: cli-integration
    fallback_keys:
      - scratch-git-2-cargo-cli-integration
    unprotect: true
    paths:
      - .cargo-cli-integration/registry/cache
      - .cargo-cli-integration/registry/index
      - .cargo-cli-integration/git
      - scratch-git-2/target-cli-integration/release
      - scratch-git-2/target-cli-integration/.rustc_info.json
      - scratch-git-2/target-cli-integration/CACHEDIR.TAG
    policy: pull-push
