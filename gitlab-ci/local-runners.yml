# =============================================================================
# LOCAL RUNNER VARIANTS
#
# These jobs run on a developer's local GitLab runner for faster feedback.
# When a user is listed here, their MR jobs run locally instead of on
# shared runners.
#
# Each job uses tags: [local-$GITLAB_USER_LOGIN] so only the MR author's
# local runner picks up their jobs.
#
# To opt in:
# 1. Register a local runner (see docs/local-gitlab-runner.md)
# 2. Add your username to BOTH regexes (see step 6 in the doc):
#    a. .rules.local_runner_users below (routes jobs to your runner)
#    b. .rules.skip_for_local_runner_users in 01-build-and-test.yml
#       (disables shared-runner duplicates)
#
# ⚠️  STALE CACHE TROUBLESHOOTING
#
# Local runners persist node_modules and .yarn caches between runs via Docker
# volumes. If you see errors like "module not found", mismatched dependency
# versions, or other node_modules/yarn cache corruption, clear the volumes:
#
#   gitlab-runner stop
#   docker volume prune
#   gitlab-runner start
#
# See docs/local-gitlab-runner.md for full details.
#
# ⚠️  "CANNOT LOCK REF" ERRORS
#
# If you see `error: cannot lock ref 'refs/remotes/origin/master'` during
# the "Getting source from Git repository" step, you likely have two
# gitlab-runner processes running simultaneously. Both pick up jobs using
# the same runner token and build directory, causing a race condition
# during git fetch. This is a known GitLab Runner issue:
# https://gitlab.com/gitlab-org/gitlab-runner/-/issues/3688
#
# To fix, ensure only one gitlab-runner process is running:
#
#   ps aux | grep gitlab-runner
#
# A common cause is having both a Homebrew-managed launch agent
# (homebrew.mxcl.gitlab-runner.plist) and a manually installed one
# (gitlab-runner.plist) in ~/Library/LaunchAgents/. Remove the duplicate:
#
#   launchctl unload ~/Library/LaunchAgents/gitlab-runner.plist
#   rm ~/Library/LaunchAgents/gitlab-runner.plist
# =============================================================================

include:
  - "/gitlab-ci/stages/01-build-and-test.yml"
  - "/gitlab-ci/stages/01-smoke-tests.yml"
  - "/gitlab-ci/stages/01-cli-integration-tests.yml"
  - "/scratch-desktop/.gitlab-ci-release.yml"

.local-runner-defaults:
  tags:
    - "local-$GITLAB_USER_LOGIN"
  variables:
    # Create a dedicated Docker network per build so service containers
    # (like postgres) get proper DNS aliases. Without this, the runner
    # uses legacy --link networking which has connectivity issues on
    # Docker Desktop for Mac.
    FF_NETWORK_PER_BUILD: "true"
    # Reuse the build directory between runs so node_modules and .yarn
    # caches persist, making yarn install near-instant after the first run.
    GIT_STRATEGY: fetch
    # Disable shallow clones so fetch can always resolve new refs without
    # falling back to a fresh clone (which wipes cached build artifacts).
    GIT_DEPTH: 0
    # Clean untracked files but preserve node_modules and .yarn caches.
    # If a cache gets corrupted, run `docker volume prune` and retry.
    GIT_CLEAN_FLAGS: "-ffdx -e node_modules -e .yarn -e .next"
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "============================================================"
        echo "  LOCAL RUNNER: If this failure looks like a stale cache"
        echo "  (module not found, mismatched deps, yarn errors), run:"
        echo ""
        echo "    gitlab-runner stop"
        echo "    docker volume prune"
        echo "    gitlab-runner start"
        echo ""
        echo "  See docs/local-gitlab-runner.md for details."
        echo "============================================================"
      fi

# Docker image build jobs use the host Docker socket (mounted in config.toml)
# instead of Docker-in-Docker. DinD service containers have networking issues
# on Docker Desktop for Mac that prevent the health check from succeeding.
.local-docker-build:
  services: []
  variables:
    DOCKER_HOST: ""
    DOCKER_TLS_CERTDIR: ""
    # The Docker CLI in the CI image is older than Docker Desktop's daemon.
    # Pin the API version to avoid "client version X is too old" errors.
    DOCKER_API_VERSION: "1.44"

# Shell executor for macOS-native builds (e.g. .dmg packaging).
# Runs directly on the host — no Docker container. Requires Node 22, Yarn,
# and Git installed on the machine. See docs/local-gitlab-runner.md.
.local-macos-runner-defaults:
  tags:
    - "local-macos-$GITLAB_USER_LOGIN"
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 0
    GIT_CLEAN_FLAGS: "-ffdx -e node_modules -e .yarn -e .next"
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "============================================================"
        echo "  MACOS RUNNER: If this failure looks like missing tools,"
        echo "  ensure Node 22, Yarn, and Git are installed:"
        echo ""
        echo "    brew install node@22 yarn git"
        echo ""
        echo "  See docs/local-gitlab-runner.md for details."
        echo "============================================================"
      fi

# ✏️  ADD YOUR USERNAME HERE (1 of 2 — you must also update
#    .rules.skip_for_local_runner_users in gitlab-ci/stages/01-build-and-test.yml)
#    Note: update BOTH regexes below (local_runner_users and local_runner_users_master)
.rules:
  local_runner_users:
    - if: &local-user-if '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_USER_LOGIN =~ /^(cfonger|ryderziola|choefgen|luciocesolari|rob324)$/'
  local_runner_users_master:
    - if: &local-user-if-master '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule" && $GITLAB_USER_LOGIN =~ /^(cfonger|ryderziola|choefgen|luciocesolari|rob324)$/'
  local_runner_users_prod:
    - if: &local-user-if-prod '$CI_COMMIT_BRANCH == "prod" && $CI_PIPELINE_SOURCE != "schedule" && $GITLAB_USER_LOGIN =~ /^(cfonger|ryderziola|choefgen|luciocesolari|rob324)$/'

# -----------------------------------------------------------------------------
# Client
# -----------------------------------------------------------------------------

local build and test client:
  extends:
    - .build-and-test-client
    - .local-runner-defaults
  artifacts:
    paths: []
  rules:
    - if: *local-user-if
      changes: !reference [.changes, client]

local build client docker image for test:
  extends:
    - .build-client-docker-image-for-test
    - .local-runner-defaults
    - .local-docker-build
  rules:
    - if: *local-user-if
      changes: !reference [.changes, client-docker]

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------

local build and test server:
  extends:
    - .build-and-test-server
    - .local-runner-defaults
  rules:
    - if: *local-user-if
      changes: !reference [.changes, server]

local integration test server:
  extends:
    - .integration-test-server
    - .local-runner-defaults
  rules:
    - if: *local-user-if
      changes: !reference [.changes, server]

local build server docker image:
  extends:
    - .build-server-docker-image
    - .local-runner-defaults
    - .local-docker-build
  rules:
    - if: *local-user-if
      changes: !reference [.changes, server-docker]

# -----------------------------------------------------------------------------
# Scratch Git
# -----------------------------------------------------------------------------

local build and test scratch-git:
  extends:
    - .build-and-test-scratch-git
    - .local-runner-defaults
  rules:
    - if: *local-user-if
      changes: !reference [.changes, scratch-git]

local build scratch-git docker image:
  extends:
    - .build-scratch-git-docker-image
    - .local-runner-defaults
    - .local-docker-build
  rules:
    - if: *local-user-if
      changes: !reference [.changes, scratch-git-docker]

# -----------------------------------------------------------------------------
# Scratch Desktop
# -----------------------------------------------------------------------------

local build and test scratch-desktop:
  extends:
    - .build-and-test-scratch-desktop
    - .local-runner-defaults
  rules:
    - if: *local-user-if
      changes: !reference [.changes, scratch-desktop]

# -----------------------------------------------------------------------------
# Smoke Tests
# -----------------------------------------------------------------------------

local smoke tests:
  extends:
    - .smoke-tests
    - .local-runner-defaults
    - .local-docker-build
  rules:
    - if: *local-user-if
      changes: !reference [.changes, smoke-tests]

# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------

local dummy job:
  extends:
    - .dummy-job
    - .local-runner-defaults
  rules:
    - if: *local-user-if
      changes: !reference [.changes, dummy]

# -----------------------------------------------------------------------------
# Build CLI for Desktop (macOS only — native aarch64-apple-darwin build)
# -----------------------------------------------------------------------------

local build-cli-for-desktop-test:
  extends:
    - .build_cli_for_desktop
    - .local-runner-defaults
  variables:
    SCRATCH_DEFAULT_URL: "https://test-api.scratch.md"
  rules:
    - if: *local-user-if
      changes:
        - scratch-git-2/**/*
        - scratch-desktop/**/*

# -----------------------------------------------------------------------------
# Desktop Prod Releases — macOS (builds .dmg + .zip, no Linux)
#
# These require a shell-executor runner tagged local-macos-$GITLAB_USER_LOGIN.
# See docs/local-gitlab-runner.md for setup instructions.
# -----------------------------------------------------------------------------

"Release desktop macOS app [Local Runner] (patch version)":
  extends:
    - .release_desktop_prod_job
    - .local-macos-runner-defaults
  needs:
    - job: local build-cli-for-desktop-test
      artifacts: true
      optional: true
  before_script:
    - cd scratch-desktop && yarn install --frozen-lockfile --ignore-engines
  variables:
    RELEASE_TYPE: "patch"
    MAC_TARGETS: "dmg zip"
    BUILD_LINUX: "false"
  rules:
    - if: *local-user-if
      changes: !reference [.changes, scratch-desktop]
      when: manual
      allow_failure: true
    - if: *local-user-if-master
      when: manual
      allow_failure: true
    - if: *local-user-if-prod
      when: manual
      allow_failure: true

"Release desktop macOS app [Local Runner] (minor version)":
  extends:
    - .release_desktop_prod_job
    - .local-macos-runner-defaults
  needs:
    - job: local build-cli-for-desktop-test
      artifacts: true
      optional: true
  before_script:
    - cd scratch-desktop && yarn install --frozen-lockfile --ignore-engines
  variables:
    RELEASE_TYPE: "minor"
    MAC_TARGETS: "dmg zip"
    BUILD_LINUX: "false"
  rules:
    - if: *local-user-if-master
      when: manual
      allow_failure: true
    - if: *local-user-if-prod
      when: manual
      allow_failure: true

"Release desktop macOS app [Local Runner] (major version)":
  extends:
    - .release_desktop_prod_job
    - .local-macos-runner-defaults
  needs:
    - job: local build-cli-for-desktop-test
      artifacts: true
